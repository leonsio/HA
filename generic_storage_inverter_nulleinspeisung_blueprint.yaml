blueprint:
  name: Zendure/Solarman Nulleinspeisung mit 2 Speichern - Geraeteauswahl v14
  description: >-
    Regelt zwei Zendure-Speicher ueber die offizielle Zendure Home Assistant
    Integration und einen ueber Solarman angebundenen Wechselrichter auf
    moeglichst geringe Netzeinspeisung. Fuer Speicher 1 und Speicher 2 wird
    jeweils nur das Home-Assistant-Geraet ausgewaehlt. Die benoetigten
    Zendure-Entitaeten werden zur Laufzeit aus den Geraete-Entitaeten
    abgeleitet: electric_level/soc_level, output_pack_power,
    pack_input_power, total_kwh, available_kwh, ac_mode, input_limit,
    output_limit, inverse_max_power und
    optional grid_off_mode bzw. ein Off-Grid-Switch. Der Off-Grid-Port wird
    nur an dem separat ausgewaehlten Zendure-Speichergeraet geschaltet, an
    dessen Off-Grid-Port der Wechselrichter angeschlossen ist. Der Netzsensor
    wird aus einem Shelly-Geraet bevorzugt ueber total_active_power abgeleitet. Die
    Wechselrichterbegrenzung wird aus dem Solarman-Geraet ueber die Number
    *_active_power_regulation abgeleitet und als Prozentwert gesetzt. Die
    Regelung laeuft jede Sekunde. Speicher-zu-Speicher-Transfer ueber das
    Hausnetz ist nur erlaubt, wenn der annehmende Speicher einen niedrigeren
    SoC hat als der abgebende Speicher. Fuer nicht volle Speicher wird der
    Transfer jetzt quellbezogen berechnet: Die aktuelle Batterieladeleistung
    des abgebenden Speichers muss die aktuell benoetigte Haus-Einspeisung
    voll abdecken und zusaetzlich den konfigurierten Wert
    surplus_exchange_threshold_w uebersteigen; nur der Anteil oberhalb dieser
    Schwelle wird an den anderen Speicher weitergegeben. Ist ein Speicher
    voll, wird sein verfuegbarer Ueberschuss ohne diese Schwelle, aber mit
    Totband, an den zweiten Speicher uebergeben. Die normale Ladeleistung aus
    bzw. ueber das Hausnetz bleibt konfigurierbar. Die Entladung zur
    Hausversorgung und die Abgabe beim Speicher-zu-Speicher-Transfer werden
    je Speicher automatisch ueber die Zendure-Entitaet *_inverse_max_power
    begrenzt. Bei der Einspeisung/Entladung ins Hausnetz
    wird die kapazitaets- und ladeleistungsbasierte Verteilung nur bis zur
    automatisch ermittelten Einzel-Speicher-Grenze angewendet; wird mehr
    Leistung gebraucht, duerfen beide Speicher parallel bis zu ihrem jeweiligen
    *_inverse_max_power-Wert liefern. Sind beide Speicher voll, werden
    sie bis zu dieser Grenze gleichmaessig genutzt. Sind beide Speicher nicht
    voll, wird der Speicher mit groesserer verfuegbarer Energie aus
    *_available_kwh im Verhaeltnis zur Gesamtkapazitaet und mit hoeherer
    aktueller Batterieladeleistung staerker herangezogen. Erreicht ein
    Speicher den unteren SoC-Wert oder meldet keine verfuegbare Energie, wird
    er fuer die Einspeisung gesperrt; der andere Speicher uebernimmt die
    Einspeisung dann allein, soweit sein aus *_inverse_max_power gelesener
    Leistungsgrenzwert ausreicht. Zendure-AC-Modi werden fest mit input zum
    Laden und output zum Entladen gesetzt. Der Off-Grid-Modus wird fest mit
    off zum Abschalten und normal zum Einschalten gesetzt.
  domain: automation
  input:
    grid_meter_device:
      name: Netzanschluss - Shelly Geraet
      description: >-
        Shelly Pro 3EM oder anderes Shelly-Leistungsmessgeraet. Der Blueprint
        sucht innerhalb dieses Geraets bevorzugt einen Sensor mit Suffix
        _total_active_power oder _total_power. Erwartet: positiv = Netzbezug,
        negativ = Einspeisung. Falls dein Sensor andersherum zaehlt, unten
        Vorzeichen invertieren aktivieren.
      selector:
        device:
          filter:
            - integration: shelly
          entity:
            - domain: sensor
              device_class: power
    invert_grid_sign:
      name: Netzleistung Vorzeichen invertieren
      default: false
      selector:
        boolean: {}

    storage1_device:
      name: Speicher 1 - Zendure Geraet
      description: >-
        Physisches Zendure-Speichergeraet aus der Zendure Home Assistant
        Integration, z. B. ein SolarFlow 800 Pro, SolarFlow 2400 AC+ oder ein
        anderes von Zendure-HA unterstuetztes Speichergeraet. Nicht den
        Zendure Manager auswaehlen.
      selector:
        device:
          filter:
            - integration: zendure_ha
          entity:
            - domain: sensor
    storage2_device:
      name: Speicher 2 - Zendure Geraet
      description: >-
        Zweites physisches Zendure-Speichergeraet aus der Zendure Home
        Assistant Integration. Nicht dasselbe Geraet wie Speicher 1 und nicht
        den Zendure Manager auswaehlen.
      selector:
        device:
          filter:
            - integration: zendure_ha
          entity:
            - domain: sensor


    offgrid_inverter_storage_device:
      name: Speicher mit Wechselrichter am Off-Grid-Port
      description: >-
        Zendure-Speichergeraet, an dessen Off-Grid-Port der Wechselrichter
        angeschlossen ist. Dieses Geraet muss identisch mit Speicher 1 oder
        Speicher 2 sein. Nur bei diesem ausgewaehlten Geraet wird der
        Off-Grid-Port bei Wechselrichter-Ausfall ausgeschaltet und bei
        Wiederkehr wieder eingeschaltet.
      selector:
        device:
          filter:
            - integration: zendure_ha
          entity:
            - domain: sensor

    inverter_device:
      name: Wechselrichter - Solarman Geraet
      description: >-
        Deye-/Solarman-Geraet. Der Blueprint sucht darin die Number-Entitaet
        mit Suffix oder Namensbestandteil _active_power_regulation. Diese
        Entitaet muss einen Prozentwert von 0 bis 100 akzeptieren.
      selector:
        device:
          filter:
            - integration: solarman
          entity:
            - domain: number
    inverter_max_w:
      name: Wechselrichter - maximale AC-Leistung
      description: >-
        Maximale Wechselrichterleistung in Watt. Daraus wird die Prozentgrenze
        fuer Solarman *_active_power_regulation berechnet. Beispiel: 2000 W
        Maximalleistung und Ziel 1000 W ergeben 50 Prozent.
      default: 2000
      selector:
        number:
          min: 100
          max: 20000
          step: 10
          unit_of_measurement: W
          mode: box
    inverter_min_w:
      name: Wechselrichter - minimale erlaubte Leistung
      default: 0
      selector:
        number:
          min: 0
          max: 5000
          step: 10
          unit_of_measurement: W
          mode: box
    inverter_ramp_w:
      name: Wechselrichter - Drossel-/Entdrossel-Schritt je Regelzyklus
      default: 100
      selector:
        number:
          min: 10
          max: 2000
          step: 10
          unit_of_measurement: W
          mode: slider
    inverter_unthrottle_soc:
      name: Wechselrichter wieder entdrosseln unter SoC
      default: 96
      selector:
        number:
          min: 50
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    max_house_grid_power_w:
      name: Maximale Ladeleistung ueber das Hausnetz
      description: >-
        Maximale Ladeleistung, die fuer normale Ueberschussladung und
        Netz-Notladung ueber das Hausnetz genutzt wird. Default 1000 W.
        Die Entladung zur Hausversorgung wird nicht durch diesen Wert,
        sondern automatisch durch *_inverse_max_power des jeweiligen Speichers
        begrenzt. Speicher-zu-Speicher-Transfer wird ebenfalls durch
        *_inverse_max_power des abgebenden Speichers und die Ladegrenze des
        annehmenden Speichers begrenzt.
      default: 1000
      selector:
        number:
          min: 100
          max: 5000
          step: 10
          unit_of_measurement: W
          mode: box
    surplus_exchange_threshold_w:
      name: Tolerierter Quell-Ueberschuss vor Speicher-Transfer
      description: >-
        Speicher-zu-Speicher-Transfer bei nicht vollem abgebendem Speicher
        wird erst aktiviert, wenn die quellbezogene Ueberschussrechnung diesen
        Wert ueberschreitet. Berechnung je moeglichem abgebendem Speicher:
        aktuelle Batterieladeleistung minus aktuell benoetigte Haus-
        Einspeisung. Nur der Anteil oberhalb dieses Grenzwerts wird an den
        anderen Speicher weitergegeben. Beispiel: 1000 W Batterieladung,
        200 W benoetigte Haus-Einspeisung und 200 W Grenzwert ergeben
        600 W moeglichen Transfer. Ist der abgebende Speicher voll, wird
        stattdessen sein verfuegbarer Ueberschuss oberhalb des Totbands
        uebergeben. Default 1000 W.
      default: 1000
      selector:
        number:
          min: 0
          max: 5000
          step: 10
          unit_of_measurement: W
          mode: box
    zero_tolerance_w:
      name: Totband um Nulleinspeisung
      default: 40
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: W
          mode: slider
    min_change_w:
      name: Mindest-Aenderung fuer neue Leistungsvorgabe
      default: 20
      selector:
        number:
          min: 1
          max: 200
          step: 1
          unit_of_measurement: W
          mode: slider

    full_soc:
      name: Speicher gilt als voll ab SoC
      default: 98
      selector:
        number:
          min: 80
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    reserve_soc:
      name: Entlade-Reserve SoC
      default: 15
      selector:
        number:
          min: 0
          max: 80
          step: 1
          unit_of_measurement: "%"
          mode: slider
    grid_charge_soc:
      name: Netz-Nachladen starten unter SoC
      default: 10
      selector:
        number:
          min: 0
          max: 80
          step: 1
          unit_of_measurement: "%"
          mode: slider
    grid_charge_stop_soc:
      name: Netz-Nachladen fortsetzen bis SoC
      default: 20
      selector:
        number:
          min: 1
          max: 90
          step: 1
          unit_of_measurement: "%"
          mode: slider
    emergency_charge_w:
      name: Notladeleistung je niedrigem Speicher
      default: 300
      selector:
        number:
          min: 50
          max: 2000
          step: 10
          unit_of_measurement: W
          mode: box
    mutual_emergency_soc_margin:
      name: Reserve fuer gegenseitige Notaufladung ueber SoC-Limit
      description: >-
        Ein Speicher darf den anderen zur Notaufladung ueber das Hausnetz nur
        versorgen, wenn sein SoC mindestens um diesen Wert ueber dem
        Netz-Nachladen-Start-SoC liegt und hoeher ist als der SoC des
        annehmenden Speichers. Default: 20 Prozentpunkte. Beispiel: Start
        unter 10 Prozent und Reserve 20 bedeutet, dass der gebende Speicher
        mindestens 30 Prozent SoC haben muss. Andernfalls wird aus dem Netz
        geladen.
      default: 20
      selector:
        number:
          min: 0
          max: 80
          step: 1
          unit_of_measurement: "%"
          mode: slider
    balance_transfer_min_w:
      name: Mindestleistung fuer Speicher-Ausgleich
      description: >-
        Unterhalb dieser Leistung wird kein zusaetzlicher Speicher-zu-Speicher-
        Ausgleich gestartet. Der Wert dient als Mindestleistung nach allen
        Pruefungen: SoC-Richtung, Quell-Ueberschuss, Haus-Einspeisungsreserve,
        Entladegrenze des abgebenden Speichers und Ladegrenze des annehmenden
        Speichers.
      default: 50
      selector:
        number:
          min: 0
          max: 500
          step: 10
          unit_of_measurement: W
          mode: slider
    balance_soc_margin:
      name: Mindest-SoC-Vorsprung des abgebenden Speichers
      description: >-
        Speicher-zu-Speicher-Ausgleich ueber das Hausnetz wird nur freigegeben,
        wenn der abgebende Speicher um mindestens diesen Wert mehr SoC hat als
        der annehmende Speicher. Default 0 bedeutet: der annehmende Speicher
        muss nur niedriger sein.
      default: 0
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          unit_of_measurement: "%"
          mode: slider

trigger:
  - platform: time_pattern
    seconds: "/1"

# condition: Keine globalen Bedingungen; alle fachlichen Pruefungen erfolgen in den kommentierten choose-/conditions-Bloecken.
# Detail: Die Automation soll jede Sekunde laufen und darf nicht schon vorab durch eine globale condition blockiert werden.
# Detail: Sicherheitsstopps, Off-Grid-Umschaltung, Wechselrichterdrosselung und Speicherbefehle werden deshalb bewusst erst in den einzelnen action-Zweigen entschieden.
# Detail: So bleibt in jedem Zweig nachvollziehbar, welche Messwerte bzw. Grenzwerte zu einer Aktion fuehren.
condition: []

variables:
  # Block: globale Blueprint-Metadaten.
  # Detail: Dieser oberste variables-Block gehoert nicht zum Regelalgorithmus, sondern stellt nur eine interne Versionsmarke bereit.
  # Detail: Die Marke kann in Trace-Ausgaben, Logbuch oder beim Vergleichen mehrerer Blueprint-Dateien helfen.
  # Detail: Es werden hier keine Geraete gelesen, keine Leistungen berechnet und keine Entitaeten veraendert.
  # Setzt nur die interne Versionskennung fuer Diagnose und Nachvollziehbarkeit; es wird keine Steuerentscheidung berechnet.
  blueprint_version: "2026-05-22-zendure-device-v14-source-surplus-exchange"

mode: single
max_exceeded: silent

action:
  - variables:
      # Block: Eingabewerte aus der Blueprint-Maske uebernehmen.
      # Detail: Home-Assistant-Blueprint-Eingaben werden hier einmalig in normal nutzbare Template-Variablen kopiert.
      # Detail: Dazu gehoeren die ausgewaehlten Geraete, Vorzeichenoptionen, SoC-Schwellen, Ladegrenzen und Solarman-Parameter.
      # Detail: In diesem Block wird noch nichts gemessen und nichts geregelt; er dient nur als Konfigurationsbasis fuer alle nachfolgenden Berechnungen.
      # Detail: Variablen mit Suffix _value stammen aus der Eingabemaske, waehrend die Zendure-Modusnamen hier bewusst fest auf input/output und normal/off gesetzt werden.
      # Setzt die ausgewaehlten Geraete, Grenzwerte, SoC-Schwellen sowie feste Zendure-Modusnamen als lokale Variablen fuer alle folgenden Berechnungen.
      grid_meter_device_id: !input grid_meter_device
      storage1_device_id: !input storage1_device
      storage2_device_id: !input storage2_device
      offgrid_inverter_storage_device_id: !input offgrid_inverter_storage_device
      inverter_device_id: !input inverter_device
      invert_grid_sign_value: !input invert_grid_sign

      inverter_max_w_value: !input inverter_max_w
      inverter_min_w_value: !input inverter_min_w
      inverter_ramp_w_value: !input inverter_ramp_w
      inverter_unthrottle_soc_value: !input inverter_unthrottle_soc

      # Feste Zendure-HA-Optionsnamen: AC input = Laden, AC output = Entladen.
      storage_input_option_value: "input"
      storage_output_option_value: "output"
      # Feste Zendure-HA-Off-Grid-Optionsnamen: normal = Port aktiv, off = Port deaktiviert.
      offgrid_on_option_value: "normal"
      offgrid_off_option_value: "off"
      max_house_grid_power_w_value: !input max_house_grid_power_w
      surplus_exchange_threshold_w_value: !input surplus_exchange_threshold_w
      zero_tolerance_w_value: !input zero_tolerance_w
      min_change_w_value: !input min_change_w
      full_soc_value: !input full_soc
      reserve_soc_value: !input reserve_soc
      grid_charge_soc_value: !input grid_charge_soc
      grid_charge_stop_soc_value: !input grid_charge_stop_soc
      emergency_charge_w_value: !input emergency_charge_w
      mutual_emergency_soc_margin_value: !input mutual_emergency_soc_margin
      balance_transfer_min_w_value: !input balance_transfer_min_w
      balance_soc_margin_value: !input balance_soc_margin

  - variables:
      # Block: Entitaeten automatisch aus den ausgewaehlten Geraeten ableiten.
      # Detail: Fuer jedes ausgewaehlte Home-Assistant-Geraet werden alle zugeordneten Entitaeten mit device_entities() durchsucht.
      # Detail: Der Blueprint sucht keine frei waehlbaren Einzelentitaeten mehr, sondern erkennt die benoetigten Zendure-HA-, Shelly- und Solarman-Entitaeten anhand von Domain und typischen Suffixen.
      # Detail: Fuer die Speicher werden SoC, Batterie-Ladeleistung, optionale Entladeleistung, *_total_kwh, *_available_kwh, ac_mode, input_limit, output_limit und *_inverse_max_power gesucht.
      # Detail: Fuer den Off-Grid-Port wird nur im separat ausgewaehlten Speichergeraet gesucht, damit nicht versehentlich der Off-Grid-Port des anderen Speichers geschaltet wird.
      # Detail: Fuer den Wechselrichter wird innerhalb des Solarman-Geraets die Number-Entitaet *_active_power_regulation gesucht, weil diese spaeter den Prozentwert erhaelt.
      # Berechnet bzw. sucht die benoetigten Entity-IDs anhand typischer Zendure-HA-, Shelly- und Solarman-Suffixe; die Entladegrenze kommt aus *_inverse_max_power.
      grid_power_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(grid_meter_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_total_active_power') or oid.endswith('_total_power') or oid.endswith('_active_power_total') or oid.endswith('_power_total')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {% if ns.e == '' %}
          {% for e in device_entities(grid_meter_device_id) if e.startswith('sensor.') %}
            {% set oid = e.split('.', 1)[1] %}
            {% set fn = state_attr(e, 'friendly_name') | default('', true) | lower %}
            {% if ns.e == '' and (state_attr(e, 'device_class') == 'power') and ('total' in oid or 'gesamt' in oid or 'total' in fn or 'gesamt' in fn) %}
              {% set ns.e = e %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.e }}

      storage1_soc_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_electric_level') or oid.endswith('_soc_level') or oid.endswith('_battery_level')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_battery_charge_power_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_output_pack_power') or oid.endswith('_battery_input_power') or oid.endswith('_charge_power')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_battery_discharge_power_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_pack_input_power') or oid.endswith('_battery_output_power') or oid.endswith('_discharge_power')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_total_kwh_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and oid.endswith('_total_kwh') %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_available_kwh_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and oid.endswith('_available_kwh') %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_ac_select_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('select.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_ac_mode') or oid.endswith('_acmode')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_input_number_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('number.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_input_limit') or oid.endswith('_ac_input_limit') or oid.endswith('_inputlimit')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_output_number_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('number.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_output_limit') or oid.endswith('_ac_output_limit') or oid.endswith('_outputlimit')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_inverse_max_power_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (e.startswith('number.') or e.startswith('sensor.')) and (oid.endswith('_inverse_max_power') or oid.endswith('_inversemaxpower')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage1_offgrid_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage1_device_id) if e.startswith('select.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_grid_off_mode') or oid.endswith('_off_grid_mode') or oid.endswith('_offgrid_mode')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {% if ns.e == '' %}
          {% for e in device_entities(storage1_device_id) if e.startswith('switch.') %}
            {% set oid = e.split('.', 1)[1] %}
            {% if ns.e == '' and ('off_grid' in oid or 'offgrid' in oid or 'grid_off' in oid) %}
              {% set ns.e = e %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.e }}

      storage2_soc_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_electric_level') or oid.endswith('_soc_level') or oid.endswith('_battery_level')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_battery_charge_power_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_output_pack_power') or oid.endswith('_battery_input_power') or oid.endswith('_charge_power')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_battery_discharge_power_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_pack_input_power') or oid.endswith('_battery_output_power') or oid.endswith('_discharge_power')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_total_kwh_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and oid.endswith('_total_kwh') %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_available_kwh_sensor_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('sensor.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and oid.endswith('_available_kwh') %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_ac_select_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('select.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_ac_mode') or oid.endswith('_acmode')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_input_number_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('number.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_input_limit') or oid.endswith('_ac_input_limit') or oid.endswith('_inputlimit')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_output_number_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('number.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_output_limit') or oid.endswith('_ac_output_limit') or oid.endswith('_outputlimit')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_inverse_max_power_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (e.startswith('number.') or e.startswith('sensor.')) and (oid.endswith('_inverse_max_power') or oid.endswith('_inversemaxpower')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}
      storage2_offgrid_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(storage2_device_id) if e.startswith('select.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_grid_off_mode') or oid.endswith('_off_grid_mode') or oid.endswith('_offgrid_mode')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {% if ns.e == '' %}
          {% for e in device_entities(storage2_device_id) if e.startswith('switch.') %}
            {% set oid = e.split('.', 1)[1] %}
            {% if ns.e == '' and ('off_grid' in oid or 'offgrid' in oid or 'grid_off' in oid) %}
              {% set ns.e = e %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.e }}

      selected_offgrid_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(offgrid_inverter_storage_device_id) if e.startswith('select.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_grid_off_mode') or oid.endswith('_off_grid_mode') or oid.endswith('_offgrid_mode')) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {% if ns.e == '' %}
          {% for e in device_entities(offgrid_inverter_storage_device_id) if e.startswith('switch.') %}
            {% set oid = e.split('.', 1)[1] %}
            {% if ns.e == '' and ('off_grid' in oid or 'offgrid' in oid or 'grid_off' in oid) %}
              {% set ns.e = e %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.e }}

      inverter_active_power_regulation_entity: >-
        {% set ns = namespace(e='') %}
        {% for e in device_entities(inverter_device_id) if e.startswith('number.') %}
          {% set oid = e.split('.', 1)[1] %}
          {% if ns.e == '' and (oid.endswith('_active_power_regulation') or 'active_power_regulation' in oid) %}
            {% set ns.e = e %}
          {% endif %}
        {% endfor %}
        {{ ns.e }}

  - variables:
      # Block: Ergebnis der automatischen Entitaetszuordnung pruefen.
      # Detail: Dieser Block sammelt alle Pflicht-Entitaeten, die im vorherigen Suchblock nicht gefunden wurden.
      # Detail: Die Sammelmeldung ist bewusst lesbar formuliert, damit in Home Assistant klar wird, welches Suffix oder welches Geraet fehlt.
      # Detail: Fehlt nur eine Pflicht-Entitaet, wird critical_entity_missing auf true gesetzt und der naechste choose-Block stoppt den Zyklus mit Benachrichtigung.
      # Detail: Dadurch werden keine falschen 0-Werte, keine falschen AC-Modi und keine falsche Wechselrichterbegrenzung gesetzt, wenn die automatische Zuordnung nicht eindeutig ist.
      # Setzt eine Sammelmeldung aller fehlenden Pflicht-Entitaeten und berechnet, ob der Regelzyklus sicher abgebrochen werden muss.
      missing_entities_message: >-
        {% set missing = [] %}
        {% if grid_power_sensor_entity == '' %}{% set missing = missing + ['Shelly total_active_power/total_power'] %}{% endif %}
        {% if storage1_soc_sensor_entity == '' %}{% set missing = missing + ['Speicher 1 electric_level/soc_level'] %}{% endif %}
        {% if storage1_battery_charge_power_sensor_entity == '' %}{% set missing = missing + ['Speicher 1 output_pack_power'] %}{% endif %}
        {% if storage1_total_kwh_sensor_entity == '' %}{% set missing = missing + ['Speicher 1 total_kwh'] %}{% endif %}
        {% if storage1_available_kwh_sensor_entity == '' %}{% set missing = missing + ['Speicher 1 available_kwh'] %}{% endif %}
        {% if storage1_ac_select_entity == '' %}{% set missing = missing + ['Speicher 1 ac_mode'] %}{% endif %}
        {% if storage1_input_number_entity == '' %}{% set missing = missing + ['Speicher 1 input_limit'] %}{% endif %}
        {% if storage1_output_number_entity == '' %}{% set missing = missing + ['Speicher 1 output_limit'] %}{% endif %}
        {% if storage1_inverse_max_power_entity == '' %}{% set missing = missing + ['Speicher 1 inverse_max_power'] %}{% endif %}
        {% if storage2_soc_sensor_entity == '' %}{% set missing = missing + ['Speicher 2 electric_level/soc_level'] %}{% endif %}
        {% if storage2_battery_charge_power_sensor_entity == '' %}{% set missing = missing + ['Speicher 2 output_pack_power'] %}{% endif %}
        {% if storage2_total_kwh_sensor_entity == '' %}{% set missing = missing + ['Speicher 2 total_kwh'] %}{% endif %}
        {% if storage2_available_kwh_sensor_entity == '' %}{% set missing = missing + ['Speicher 2 available_kwh'] %}{% endif %}
        {% if storage2_ac_select_entity == '' %}{% set missing = missing + ['Speicher 2 ac_mode'] %}{% endif %}
        {% if storage2_input_number_entity == '' %}{% set missing = missing + ['Speicher 2 input_limit'] %}{% endif %}
        {% if storage2_output_number_entity == '' %}{% set missing = missing + ['Speicher 2 output_limit'] %}{% endif %}
        {% if storage2_inverse_max_power_entity == '' %}{% set missing = missing + ['Speicher 2 inverse_max_power'] %}{% endif %}
        {% if offgrid_inverter_storage_device_id not in [storage1_device_id, storage2_device_id] %}{% set missing = missing + ['Off-Grid-Geraet muss Speicher 1 oder Speicher 2 sein'] %}{% endif %}
        {% if selected_offgrid_entity == '' %}{% set missing = missing + ['Ausgewaehltes Off-Grid-Geraet grid_off_mode/off_grid switch'] %}{% endif %}
        {% if inverter_active_power_regulation_entity == '' %}{% set missing = missing + ['Solarman active_power_regulation'] %}{% endif %}
        {{ missing | join(', ') }}
      critical_entity_missing: >-
        {{ missing_entities_message | trim != '' }}

  # choose: Stoppt den Regelzyklus, wenn Pflicht-Entitaeten aus den ausgewaehlten Geraeten nicht gefunden wurden.
  # Detail: Dieser choose-Block ist die erste harte Schutzschicht nach der Geraete- und Entitaetserkennung.
  # Detail: Er fuehrt nur einen Fehlerzweig aus: Benachrichtigung erzeugen und Automation fuer diesen Sekundenzyklus beenden.
  # Detail: Ohne diesen Stopp koennten spaetere Service-Aufrufe leere entity_id-Werte oder falsch erkannte Entitaeten verwenden.
  - choose:
      # conditions: Wahr, sobald mindestens eine benoetigte Zendure-, Shelly- oder Solarman-Entitaet fehlt.
      # Detail: Die Bedingung prueft die zuvor berechnete Sammelvariable critical_entity_missing.
      # Detail: true bedeutet, dass mindestens eine Pflicht-Entitaet leer ist oder das Off-Grid-Auswahlgeraet nicht Speicher 1 bzw. Speicher 2 entspricht.
      # Detail: In diesem Fall werden keine Leistungswerte berechnet, sondern nur die konkrete Fehlermeldung per persistent_notification ausgegeben.
      - conditions:
          - condition: template
            value_template: "{{ critical_entity_missing | bool(false) }}"
        sequence:
          - service: persistent_notification.create
            data:
              notification_id: zendure_solarman_nulleinspeisung_missing_entities
              title: Zendure/Solarman Nulleinspeisung - Entitaeten nicht gefunden
              message: >-
                Der Blueprint konnte folgende Entitaeten nicht automatisch aus
                den ausgewaehlten Geraeten ableiten: {{ missing_entities_message }}.
                Bitte pruefen, ob wirklich physische Zendure-HA Speichergeraete,
                ein Shelly-Netzzaehler, ein Solarman-Wechselrichtergeraet und
                fuer den Off-Grid-Port Speicher 1 oder Speicher 2 ausgewaehlt
                wurden und ob die Entity-IDs nicht manuell so umbenannt wurden,
                dass die Standard-Suffixe fehlen.
          - stop: Benoetigte Entitaeten wurden nicht gefunden.

  - service: persistent_notification.dismiss
    data:
      notification_id: zendure_solarman_nulleinspeisung_missing_entities
    continue_on_error: true

  - variables:
      # Block: aktuelle Messwerte und Geraetegrenzen einlesen.
      # Detail: Ab hier beginnt der eigentliche Sekunden-Regelzyklus mit echten Zustandswerten aus Home Assistant.
      # Detail: Der Shelly-Wert wird in eine einheitliche Vorzeichenlogik gebracht: positiv bedeutet Netzbezug, negativ bedeutet Einspeisung.
      # Detail: SoC, aktuelle Batterie-Lade-/Entladeleistungen, *_total_kwh und *_available_kwh werden in Zahlen umgewandelt und fuer spaetere Gewichtungen vorbereitet.
      # Detail: Die technischen Ladegrenzen kommen aus den Zendure-Input-Number-Attributen, die Entlade-/Transfergrenzen kommen aus den Zendure-Entitaeten *_inverse_max_power.
      # Detail: Die aktuelle Solarman-Prozentbegrenzung wird zusaetzlich in Watt umgerechnet, damit die Drosselung in einer einheitlichen Watt-Logik berechnet werden kann.
      # Berechnet Netzleistung, SoC, Lade-/Entladeleistungen, Kapazitaeten in Wh, Speicherlimits aus *_inverse_max_power und aktuelle Wechselrichterleistung.
      # Messwert des Netzanschlusses in Watt.
      # Berechnung: Shelly-Wert * -1, wenn die Option "Vorzeichen invertieren" aktiv ist.
      # Erwartete Bedeutung danach: positive Werte = Netzbezug, negative Werte = Einspeisung.
      grid_power_w: >-
        {% set p = states(grid_power_sensor_entity) | float(0) %}
        {{ (p * (-1 if invert_grid_sign_value else 1)) | round(0) }}

      # Aktueller Ladezustand von Speicher 1 und Speicher 2 in Prozent.
      storage1_soc: "{{ states(storage1_soc_sensor_entity) | float(0) }}"
      storage2_soc: "{{ states(storage2_soc_sensor_entity) | float(0) }}"

      # Batterieladeleistung laut Zendure-Integration.
      # Negative oder unplausible Werte werden auf 0 begrenzt, damit nur echte Ladeleistung zaehlt.
      storage1_batt_charge_w: "{{ ([states(storage1_battery_charge_power_sensor_entity) | float(0), 0] | max) | round(0) }}"
      storage2_batt_charge_w: "{{ ([states(storage2_battery_charge_power_sensor_entity) | float(0), 0] | max) | round(0) }}"

      # Batterie-Entladeleistung, falls die Integration einen passenden Sensor liefert.
      # Der Wert wird nur fuer Diagnose und robuste Plausibilitaet mitgefuehrt.
      storage1_batt_discharge_w: "{{ ([states(storage1_battery_discharge_power_sensor_entity) | float(0), 0] | max) | round(0) }}"
      storage2_batt_discharge_w: "{{ ([states(storage2_battery_discharge_power_sensor_entity) | float(0), 0] | max) | round(0) }}"

      # Gesamtkapazitaet wird aus *_total_kwh gelesen, nicht manuell abgefragt.
      # Berechnung Wh: kWh * 1000.
      storage1_total_kwh: "{{ states(storage1_total_kwh_sensor_entity) | float(0) }}"
      storage2_total_kwh: "{{ states(storage2_total_kwh_sensor_entity) | float(0) }}"
      storage1_capacity_wh: "{{ (([states(storage1_total_kwh_sensor_entity) | float(0), 0.001] | max) * 1000) | round(0) }}"
      storage2_capacity_wh: "{{ (([states(storage2_total_kwh_sensor_entity) | float(0), 0.001] | max) * 1000) | round(0) }}"

      # Verfuegbare Energie wird aus *_available_kwh gelesen.
      # Diese Zendure-Groesse wird fuer die Entlade-/Einspeiseverteilung verwendet, damit groessere bzw. voller verfuegbare Speicher staerker herangezogen werden.
      # Berechnung Wh: available_kwh * 1000. Verhaeltnis: available_kwh / total_kwh, begrenzt auf 0..1.
      storage1_available_kwh: "{{ [states(storage1_available_kwh_sensor_entity) | float(0), 0] | max }}"
      storage2_available_kwh: "{{ [states(storage2_available_kwh_sensor_entity) | float(0), 0] | max }}"
      storage1_available_wh: "{{ (([states(storage1_available_kwh_sensor_entity) | float(0), 0] | max) * 1000) | round(0) }}"
      storage2_available_wh: "{{ (([states(storage2_available_kwh_sensor_entity) | float(0), 0] | max) * 1000) | round(0) }}"
      storage1_available_ratio: >-
        {{ ([1, [0, (storage1_available_kwh | float(0)) / ([storage1_total_kwh | float(0), 0.001] | max)] | max] | min) | round(4) }}
      storage2_available_ratio: >-
        {{ ([1, [0, (storage2_available_kwh | float(0)) / ([storage2_total_kwh | float(0), 0.001] | max)] | max] | min) | round(4) }}

      # Aktuelle Zendure-Vorgaben fuer AC-Eingang und AC-Ausgang.
      # Diese Werte werden genutzt, um aus der gemessenen Netzleistung eine unbeeinflusste Referenz zu berechnen.
      storage1_current_input_w: "{{ ([states(storage1_input_number_entity) | float(0), 0] | max) | round(0) }}"
      storage1_current_output_w: "{{ ([states(storage1_output_number_entity) | float(0), 0] | max) | round(0) }}"
      storage2_current_input_w: "{{ ([states(storage2_input_number_entity) | float(0), 0] | max) | round(0) }}"
      storage2_current_output_w: "{{ ([states(storage2_output_number_entity) | float(0), 0] | max) | round(0) }}"

      # Maximal erlaubte Ladeleistung wird aus dem max-Attribut der Zendure-Input-Number gelesen.
      # Falls kein max-Attribut vorhanden ist, wird die konfigurierte maximale Ladeleistung ueber das Hausnetz verwendet.
      storage1_max_charge_w: >-
        {% set m = state_attr(storage1_input_number_entity, 'max') | float(0) %}
        {{ (m if m > 0 else max_house_grid_power_w_value | float(1000)) | round(0) }}
      storage2_max_charge_w: >-
        {% set m = state_attr(storage2_input_number_entity, 'max') | float(0) %}
        {{ (m if m > 0 else max_house_grid_power_w_value | float(1000)) | round(0) }}

      # Maximal erlaubte Entlade- und Transferleistung wird nicht mehr abgefragt.
      # Stattdessen wird der aktuelle Wert der Zendure-Entitaet *_inverse_max_power gelesen.
      # Falls die steuernde output_limit-Number ein kleineres max-Attribut meldet, wird sicherheitshalber der kleinere Wert verwendet.
      # Diese Werte begrenzen sowohl die Entladung zur Hausversorgung als auch die Abgabe beim Speicher-zu-Speicher-Transfer.
      storage1_inverse_max_power_w: "{{ ([states(storage1_inverse_max_power_entity) | float(0), 0] | max) | round(0) }}"
      storage2_inverse_max_power_w: "{{ ([states(storage2_inverse_max_power_entity) | float(0), 0] | max) | round(0) }}"
      storage1_max_discharge_w: >-
        {% set inverse = storage1_inverse_max_power_w | float(0) %}
        {% set ha_max = state_attr(storage1_output_number_entity, 'max') | float(0) %}
        {% if ha_max > 0 and inverse > 0 %}
          {{ ([inverse, ha_max] | min) | round(0) }}
        {% else %}
          {{ inverse | round(0) }}
        {% endif %}
      storage2_max_discharge_w: >-
        {% set inverse = storage2_inverse_max_power_w | float(0) %}
        {% set ha_max = state_attr(storage2_output_number_entity, 'max') | float(0) %}
        {% if ha_max > 0 and inverse > 0 %}
          {{ ([inverse, ha_max] | min) | round(0) }}
        {% else %}
          {{ inverse | round(0) }}
        {% endif %}

      # Aktuelle Solarman-Begrenzung in Prozent und daraus berechnete aktuelle Wechselrichterleistung in Watt.
      # Berechnung Watt: Prozent / 100 * konfigurierte maximale Wechselrichterleistung.
      inverter_current_percent: >-
        {{ ([100, [0, states(inverter_active_power_regulation_entity) | float(100)] | max] | min) | round(0) }}
      inverter_current_w: >-
        {{ (((inverter_current_percent | float(100)) / 100) * (inverter_max_w_value | float(1))) | round(0) }}

  - variables:
      # Block: Sicherheits-, Status- und Richtungsentscheidungen aus den Messwerten ableiten.
      # Detail: Dieser Block erzeugt aus den Rohwerten die booleschen Grundentscheidungen fuer alle folgenden Zweige.
      # Detail: Zuerst werden ungueltige Sensorzustaende erkannt; danach werden Import, Ueberschuss und eine Referenz-Netzleistung ohne aktuell gesetzte Speicherbefehle berechnet.
      # Detail: Die Referenz-Netzleistung beruecksichtigt bereits aktive Lade- und Entladebefehle, damit Speicher-zu-Speicher-Transfer nicht faelschlich als normaler Hausverbrauch interpretiert wird.
      # Detail: Danach wird festgelegt, ob Speicher voll sind, laden duerfen, entladen duerfen, Notladung brauchen oder wegen unterem SoC/available_kwh fuer Output gesperrt werden.
      # Detail: Zum Schluss werden erlaubte Transfer-Richtungen berechnet: Ein Speicher darf nur an den anderen abgeben, wenn er einen hoeheren SoC hat und der annehmende Speicher niedriger liegt.
      # Berechnet Referenz-Netzleistung, Import/Ueberschuss, Lade-/Entladefreigaben, Notladebedarf und erlaubte Transfer-Richtungen.
      # Sicherheitsentscheidung: Wenn ein kritischer Sensor fehlt oder keine Kapazitaet liefert, werden Speicherleistungen auf 0 gesetzt.
      critical_sensor_unavailable: >-
        {{ states(grid_power_sensor_entity) in ['unknown', 'unavailable', 'none']
           or states(storage1_soc_sensor_entity) in ['unknown', 'unavailable', 'none']
           or states(storage2_soc_sensor_entity) in ['unknown', 'unavailable', 'none']
           or states(storage1_total_kwh_sensor_entity) in ['unknown', 'unavailable', 'none']
           or states(storage2_total_kwh_sensor_entity) in ['unknown', 'unavailable', 'none']
           or states(storage1_available_kwh_sensor_entity) in ['unknown', 'unavailable', 'none']
           or states(storage2_available_kwh_sensor_entity) in ['unknown', 'unavailable', 'none']
           or states(storage1_inverse_max_power_entity) in ['unknown', 'unavailable', 'none']
           or states(storage2_inverse_max_power_entity) in ['unknown', 'unavailable', 'none']
           or (storage1_total_kwh | float(0)) <= 0
           or (storage2_total_kwh | float(0)) <= 0 }}

      # Sicherheitsentscheidung: Der Wechselrichter gilt als nicht erreichbar, wenn die Solarman-Number keinen gueltigen Zustand liefert.
      inverter_unavailable: >-
        {% set s = states(inverter_active_power_regulation_entity) | lower %}
        {{ s in ['unknown', 'unavailable', 'none', 'off', 'false', 'offline',
                 'not_connected', 'not connected', 'unreachable', 'problem'] }}

      # Summe der aktuell eingestellten Speicher-Ladeleistungen.
      current_input_total_w: "{{ (storage1_current_input_w | float(0) + storage2_current_input_w | float(0)) | round(0) }}"

      # Summe der aktuell eingestellten Speicher-Entladeleistungen.
      current_output_total_w: "{{ (storage1_current_output_w | float(0) + storage2_current_output_w | float(0)) | round(0) }}"

      # Referenz-Netzleistung ohne die aktuell gesetzten Speicherleistungen.
      # Berechnung: gemessene Netzleistung - aktuelle Speicherladung + aktuelle Speicherentladung.
      # Damit wird ein bereits laufender Speicher-zu-Speicher-Transfer in die Hausverbrauchsbewertung einbezogen.
      uncontrolled_grid_power_w: >-
        {{ ((grid_power_w | float(0)) - (current_input_total_w | float(0)) + (current_output_total_w | float(0))) | round(0) }}

      # Positiver Anteil der Referenz-Netzleistung = Netzbezug vor Speicherregelung.
      uncontrolled_import_w: "{{ ([0, uncontrolled_grid_power_w | float(0)] | max) | round(0) }}"

      # Negativer Anteil der Referenz-Netzleistung als positiver Wert = Einspeiseueberschuss vor Speicherregelung.
      uncontrolled_surplus_w: "{{ ([0, 0 - (uncontrolled_grid_power_w | float(0))] | max) | round(0) }}"

      # Statusentscheidung: Speicher gilt ab konfiguriertem SoC als voll.
      storage1_full: "{{ (storage1_soc | float(0)) >= (full_soc_value | float(98)) }}"
      storage2_full: "{{ (storage2_soc | float(0)) >= (full_soc_value | float(98)) }}"

      # Statusentscheidung: Beide Speicher voll.
      # Diese Entscheidung erzwingt spaeter eine 50/50-Verteilung der Einspeisung/Entladung ins Hausnetz, sofern beide entladen duerfen.
      both_storages_full: "{{ (storage1_full | bool(false)) and (storage2_full | bool(false)) }}"

      # Statusentscheidung: Speicher darf laden, wenn er unterhalb der Vollgrenze minus kleiner Hysterese liegt.
      storage1_can_charge: "{{ (storage1_soc | float(0)) < ((full_soc_value | float(98)) - 0.5) }}"
      storage2_can_charge: "{{ (storage2_soc | float(0)) < ((full_soc_value | float(98)) - 0.5) }}"

      # Untere Entladegrenze fuer die Einspeisung/Entladung.
      # Entscheidung: Ein Speicher wird fuer Output gesperrt, sobald sein SoC die Entlade-Reserve erreicht
      # oder Zendure *_available_kwh praktisch keine verfuegbare Energie mehr meldet.
      # Berechnung je Speicher: SoC <= reserve_soc ODER available_kwh <= 0.01 kWh.
      storage1_output_floor_reached: >-
        {{ (storage1_soc | float(0)) <= (reserve_soc_value | float(15))
           or (storage1_available_kwh | float(0)) <= 0.01 }}
      storage2_output_floor_reached: >-
        {{ (storage2_soc | float(0)) <= (reserve_soc_value | float(15))
           or (storage2_available_kwh | float(0)) <= 0.01 }}

      # Statusentscheidung: Speicher 1 darf nur entladen/einspeisen, wenn die untere Entladegrenze nicht erreicht ist.
      # Dadurch uebernimmt Speicher 2 automatisch allein, wenn Speicher 1 leer bzw. am unteren SoC-Limit ist.
      storage1_can_discharge: "{{ not (storage1_output_floor_reached | bool(false)) }}"

      # Statusentscheidung: Speicher 2 darf nur entladen/einspeisen, wenn die untere Entladegrenze nicht erreicht ist.
      # Dadurch uebernimmt Speicher 1 automatisch allein, wenn Speicher 2 leer bzw. am unteren SoC-Limit ist.
      storage2_can_discharge: "{{ not (storage2_output_floor_reached | bool(false)) }}"

      # Diagnoseentscheidung: Speicher 1 wird durch die untere Grenze fuer die Einspeisung blockiert.
      storage1_output_blocked_by_floor: "{{ storage1_output_floor_reached | bool(false) }}"

      # Diagnoseentscheidung: Speicher 2 wird durch die untere Grenze fuer die Einspeisung blockiert.
      storage2_output_blocked_by_floor: "{{ storage2_output_floor_reached | bool(false) }}"

      # Notladeentscheidung fuer Speicher 1.
      # Start unter grid_charge_soc oder Fortsetzen bis grid_charge_stop_soc, wenn bereits geladen wird.
      storage1_needs_grid_charge: >-
        {{ (storage1_soc | float(0)) <= (grid_charge_soc_value | float(10))
           or ((storage1_soc | float(0)) < (grid_charge_stop_soc_value | float(20))
               and states(storage1_ac_select_entity) == storage_input_option_value
               and (storage1_current_input_w | float(0)) > (min_change_w_value | float(20))) }}

      # Notladeentscheidung fuer Speicher 2.
      # Gleiche Berechnung wie bei Speicher 1.
      storage2_needs_grid_charge: >-
        {{ (storage2_soc | float(0)) <= (grid_charge_soc_value | float(10))
           or ((storage2_soc | float(0)) < (grid_charge_stop_soc_value | float(20))
               and states(storage2_ac_select_entity) == storage_input_option_value
               and (storage2_current_input_w | float(0)) > (min_change_w_value | float(20))) }}

      # Entscheidung: Speicher 1 darf Speicher 2 nur im Notfall versorgen, wenn er deutlich oberhalb des Notlade-Limits liegt.
      storage1_can_support_emergency: >-
        {{ (storage1_can_discharge | bool(false)) and
           (storage1_soc | float(0)) >= ((grid_charge_soc_value | float(10)) + (mutual_emergency_soc_margin_value | float(20))) }}

      # Entscheidung: Speicher 2 darf Speicher 1 nur im Notfall versorgen, wenn er deutlich oberhalb des Notlade-Limits liegt.
      storage2_can_support_emergency: >-
        {{ (storage2_can_discharge | bool(false)) and
           (storage2_soc | float(0)) >= ((grid_charge_soc_value | float(10)) + (mutual_emergency_soc_margin_value | float(20))) }}

      # SoC-Richtungsentscheidung: Speicher 1 darf nur an Speicher 2 abgeben, wenn Speicher 2 einen niedrigeren SoC hat.
      storage1_soc_above_storage2: >-
        {{ (storage1_soc | float(0)) > ((storage2_soc | float(0)) + (balance_soc_margin_value | float(0))) }}

      # SoC-Richtungsentscheidung: Speicher 2 darf nur an Speicher 1 abgeben, wenn Speicher 1 einen niedrigeren SoC hat.
      storage2_soc_above_storage1: >-
        {{ (storage2_soc | float(0)) > ((storage1_soc | float(0)) + (balance_soc_margin_value | float(0))) }}

      # Notfallrichtung 1 -> 2: nur wenn Speicher 2 Notladung braucht, Speicher 1 nicht, Speicher 1 Reserve hat und SoC hoeher ist.
      emergency_transfer_1_to_2: >-
        {{ (storage2_needs_grid_charge | bool(false))
           and not (storage1_needs_grid_charge | bool(false))
           and (storage1_can_support_emergency | bool(false))
           and (storage1_soc_above_storage2 | bool(false)) }}

      # Notfallrichtung 2 -> 1: nur wenn Speicher 1 Notladung braucht, Speicher 2 nicht, Speicher 2 Reserve hat und SoC hoeher ist.
      emergency_transfer_2_to_1: >-
        {{ (storage1_needs_grid_charge | bool(false))
           and not (storage2_needs_grid_charge | bool(false))
           and (storage2_can_support_emergency | bool(false))
           and (storage2_soc_above_storage1 | bool(false)) }}

  # choose: Sicherheitsabschaltung, wenn Messwerte ungueltig sind oder Kapazitaeten nicht gelesen werden koennen.
  # Detail: Dieser choose-Block ist die zweite harte Schutzschicht und greift erst nach dem Einlesen aktueller Messwerte.
  # Detail: Er setzt beide Zendure-Input- und Output-Limits auf 0 W, damit bei unplausiblen Sensorwerten keine unkontrollierte Ladung oder Entladung weiterlaeuft.
  # Detail: Danach wird der aktuelle Automationslauf beendet; der naechste Sekundenzyklus versucht die Bewertung erneut.
  - choose:
      # conditions: Wahr, wenn ein kritischer Sensor unknown/unavailable ist oder *_total_kwh keine positive Kapazitaet liefert.
      # Detail: Geprueft werden Netzleistung, beide SoC-Sensoren, beide Gesamt- und Verfuegbarkeitskapazitaeten sowie positive *_total_kwh-Werte.
      # Detail: Diese Werte sind fuer Null-Einspeisung, Kapazitaetsgewichtung und Schutz der unteren SoC-Grenze zwingend erforderlich.
      # Detail: true bedeutet: Regelung sofort auf sichere 0-Watt-Vorgaben setzen und nicht weiterrechnen.
      - conditions:
          - condition: template
            value_template: "{{ critical_sensor_unavailable | bool(false) }}"
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ storage1_input_number_entity }}"
            data:
              value: 0
          - service: number.set_value
            target:
              entity_id: "{{ storage1_output_number_entity }}"
            data:
              value: 0
          - service: number.set_value
            target:
              entity_id: "{{ storage2_input_number_entity }}"
            data:
              value: 0
          - service: number.set_value
            target:
              entity_id: "{{ storage2_output_number_entity }}"
            data:
              value: 0
          - stop: Kritischer Sensor fuer die Nulleinspeisung ist nicht verfuegbar.

  # choose: Schaltet ausschliesslich den Off-Grid-Port des ausgewaehlten Zendure-Speichers, an dem der Wechselrichter angeschlossen ist.
  # Detail: Dieser Block behandelt nur die Erreichbarkeit des Solarman-/Deye-Wechselrichters und nicht die normale Lade-/Entladeregelung.
  # Detail: Wenn der Wechselrichter nicht erreichbar ist, wird nur der Off-Grid-Port des in der Eingabemaske ausgewaehlten Speichers deaktiviert.
  # Detail: Der zweite Speicher bleibt unangetastet, damit ein Off-Grid-Port ohne angeschlossenen Wechselrichter nicht unnoetig geschaltet wird.
  # Detail: Sobald Solarman wieder gueltige Werte liefert, wird genau derselbe ausgewaehlte Port wieder aktiviert.
  - choose:
      # conditions: Wahr, wenn die Solarman-Entitaet *_active_power_regulation nicht erreichbar oder ungueltig ist; dann nur den ausgewaehlten Off-Grid-Port deaktivieren.
      # Detail: Diese Bedingung nutzt inverter_unavailable aus dem Sicherheitsblock.
      # Detail: true steht fuer unknown, unavailable, offline oder vergleichbare ungueltige Zustaende der Solarman-Number.
      # Detail: Bei true wird kein anderer Speicher geschaltet, sondern nur der Wechselrichter-Port in einen sicheren Aus-Zustand gebracht.
      - conditions:
          - condition: template
            value_template: "{{ inverter_unavailable | bool(false) }}"
        sequence:
          # choose: Waehlt fuer das ausgewaehlte Off-Grid-Geraet die passende Abschaltaktion anhand des Entitaetstyps select oder switch.
          # Detail: Zendure-HA kann den Off-Grid-Modus je nach Geraet als select-Entitaet oder als switch-Entitaet bereitstellen.
          # Detail: Dieser verschachtelte choose-Block vermeidet falsche Service-Aufrufe, indem select.select_option nur fuer select.* und switch.turn_off nur fuer switch.* verwendet wird.
          # Detail: Ausgefuehrt wird jeweils nur ein Zweig, und auch nur wenn der aktuelle Zustand noch nicht dem Zielzustand entspricht.
          - choose:
              # conditions: Der ausgewaehlte Off-Grid-Port ist eine select-Entitaet und steht noch nicht auf der festen Aus-Option 'off'.
              # Detail: Der Zweig nutzt fest den Zendure-HA-Optionsnamen 'off'; dieser Wert wird nicht mehr in der Blueprint-Maske abgefragt.
              # Detail: Er verhindert unnoetige select.select_option-Aufrufe, wenn der Port bereits auf der Aus-Option steht.
              # Detail: Damit bleibt der Trace uebersichtlich und Zendure wird nicht jede Sekunde mit identischen Befehlen belastet.
              - conditions:
                  - condition: template
                    value_template: "{{ selected_offgrid_entity.startswith('select.') and states(selected_offgrid_entity) != offgrid_off_option_value }}"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: "{{ selected_offgrid_entity }}"
                    data:
                      option: "{{ offgrid_off_option_value }}"
              # conditions: Der ausgewaehlte Off-Grid-Port ist ein switch und ist noch eingeschaltet; dann ausschalten.
              # Detail: Dieser Alternativzweig gilt fuer Geraete, deren Off-Grid-Port als switch.* modelliert ist.
              # Detail: Nur ein switch im Zustand ungleich 'off' wird ausgeschaltet; ein bereits ausgeschalteter switch bleibt unveraendert.
              # Detail: Die Aktion ist damit idempotent und wird nur bei tatsaechlichem Handlungsbedarf gesendet.
              - conditions:
                  - condition: template
                    value_template: "{{ selected_offgrid_entity.startswith('switch.') and states(selected_offgrid_entity) != 'off' }}"
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: "{{ selected_offgrid_entity }}"
      # conditions: Wahr, wenn der Wechselrichter wieder erreichbar ist; dann nur den ausgewaehlten Off-Grid-Port wieder aktivieren.
      # Detail: Diese Bedingung ist das Gegenstueck zum Ausfallzweig und wird aktiv, sobald Solarman wieder einen gueltigen Zustand liefert.
      # Detail: Sie schaltet nicht beide Speicher, sondern nur den zuvor ausgewaehlten Wechselrichter-Port zurueck in den Ein-Zustand.
      # Detail: Dadurch wird der Wechselrichter nach Kommunikationswiederkehr automatisch wieder am vorgesehenen Speicher freigegeben.
      - conditions:
          - condition: template
            value_template: "{{ not (inverter_unavailable | bool(false)) }}"
        sequence:
          # choose: Waehlt fuer das ausgewaehlte Off-Grid-Geraet die passende Einschaltaktion anhand des Entitaetstyps select oder switch.
          # Detail: Auch beim Einschalten wird zwischen select.* und switch.* unterschieden.
          # Detail: Der select-Zweig setzt fest die Ein-Option 'normal', der switch-Zweig nutzt switch.turn_on.
          # Detail: Beide Zweige pruefen vorher den aktuellen Zustand, damit kein identischer Befehl jede Sekunde wiederholt wird.
          - choose:
              # conditions: Der ausgewaehlte Off-Grid-Port ist eine select-Entitaet und steht noch nicht auf der festen Ein-Option 'normal'.
              # Detail: Der Zweig nutzt fest den Zendure-HA-Optionsnamen 'normal'; dieser Wert wird nicht mehr in der Blueprint-Maske abgefragt.
              # Detail: Er wird nur ausgefuehrt, wenn der select aktuell nicht schon auf dieser Option steht.
              # Detail: So kann die gleiche Logik fuer Zendure-Geraete mit unterschiedlichen Optionsnamen genutzt werden.
              - conditions:
                  - condition: template
                    value_template: "{{ selected_offgrid_entity.startswith('select.') and states(selected_offgrid_entity) != offgrid_on_option_value }}"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: "{{ selected_offgrid_entity }}"
                    data:
                      option: "{{ offgrid_on_option_value }}"
              # conditions: Der ausgewaehlte Off-Grid-Port ist ein switch und ist noch ausgeschaltet; dann einschalten.
              # Detail: Dieser Zweig gilt fuer Off-Grid-Ports, die als switch.* angelegt sind.
              # Detail: Nur ein ausgeschalteter bzw. nicht eingeschalteter switch wird aktiviert.
              # Detail: Ist der Port bereits an, wird keine Aktion gesendet.
              - conditions:
                  - condition: template
                    value_template: "{{ selected_offgrid_entity.startswith('switch.') and states(selected_offgrid_entity) != 'on' }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ selected_offgrid_entity }}"

  - variables:
      # Block: Betriebsmodus und Speicher-zu-Speicher-Ausgleich bestimmen.
      # Detail: Dieser Block entscheidet, welcher Regelmodus in diesem Sekundenzyklus gilt: emergency, surplus, import, balance oder idle.
      # Detail: Notladung hat Vorrang vor allen anderen Modi, damit Speicher unterhalb der Notladegrenze zuerst geschuetzt werden.
      # Detail: Fuer den Speicher-zu-Speicher-Ausgleich werden jetzt zwei getrennte Regeln abgebildet.
      # Detail: Regel 1 fuer nicht volle Speicher: Der abgebende Speicher muss mit seiner aktuellen Batterieladeleistung zuerst die aktuell benoetigte Haus-Einspeisung voll abdecken koennen.
      # Detail: Nur wenn danach noch mehr als surplus_exchange_threshold_w uebrig bleibt, wird genau der Anteil oberhalb dieser Schwelle zum Laden des anderen Speichers freigegeben.
      # Detail: Beispiel: 1000 W Batterieladung, 100 W bisheriger Output von Speicher 1, 100 W bisheriger Output von Speicher 2 und 200 W Schwelle ergeben 1000 - 200 - 200 = 600 W Transfer.
      # Detail: Regel 2 fuer volle Speicher: Ist ein Speicher voll, wird sein verfuegbarer Ueberschuss an den zweiten Speicher uebergeben; dabei werden SoC-Richtung, Ladefaehigkeit und Leistungsgrenzen weiterhin beachtet.
      # Detail: Das Ergebnis balance_direction legt eindeutig fest, ob 1_to_2, 2_to_1 oder kein Transfer ausgefuehrt wird.
      # Berechnet Grundzustand, die fuer Hausversorgung reservierte Output-Leistung, quellbezogenen Ueberschuss, Vollspeicher-Transfer und finale Balance-Richtung.
      # Grundzustand der Energiefluesse ohne Speicher-zu-Speicher-Transfer.
      # Prioritaet: Notladung vor Ueberschussladen vor Entladen gegen Netzbezug.
      base_energy_state: >-
        {% if (storage1_needs_grid_charge | bool(false)) or (storage2_needs_grid_charge | bool(false)) %}
          emergency
        {% elif (uncontrolled_surplus_w | float(0)) > (zero_tolerance_w_value | float(40)) and ((storage1_can_charge | bool(false)) or (storage2_can_charge | bool(false))) %}
          surplus
        {% elif (uncontrolled_import_w | float(0)) > (zero_tolerance_w_value | float(40)) and ((storage1_can_discharge | bool(false)) or (storage2_can_discharge | bool(false))) %}
          import
        {% else %}
          idle
        {% endif %}

      # Aktuelle Netto-Speichereinspeisung fuer die Hausversorgung.
      # Berechnung: max(0, aktuell eingestellte Output-Limits beider Speicher - aktuell eingestellte Input-Limits beider Speicher).
      # Wichtig: Bei bereits laufendem Speicher-zu-Speicher-Transfer ist der Output des abgebenden Speichers groesser als der reine Hausverbrauch, weil er zusaetzlich den annehmenden Speicher laedt.
      # Durch Abzug der aktuellen Input-Limits bleibt nur der Netto-Anteil uebrig, der wirklich der Hausversorgung dient. Dadurch faellt ein laufender Transfer im naechsten Sekundenzyklus nicht faelschlich wieder heraus.
      current_net_storage_output_to_house_w: >-
        {{ ([0, (current_output_total_w | float(0)) - (current_input_total_w | float(0))] | max) | round(0) }}

      # Aktuell fuer die Hausversorgung zu reservierende Einspeiseleistung.
      # Berechnung: max(Netto-Speichereinspeisung ins Haus, berechneter Netzbezug ohne Speicherbefehle).
      # Dadurch wird ein laufender Beitrag der Speicher zur Hauslast nicht beendet, sobald zusaetzlicher Speicher-zu-Speicher-Transfer gestartet wird.
      # Im Beispiel mit 100 W Output je Speicher und 0 W Input wird hier 200 W reserviert; bei aktivem 600-W-Transfer und 800 W Output / 600 W Input bleiben ebenfalls nur 200 W Hausversorgung reserviert.
      balance_required_house_output_w: >-
        {{ ([current_net_storage_output_to_house_w | float(0), uncontrolled_import_w | float(0), 0] | max) | round(0) }}

      # Fuer volle Speicher wird zusaetzlich der reale Netzüberschuss betrachtet.
      # Diese Groesse faengt Faelle ab, in denen ein voller Speicher keine eigene Batterieladeleistung mehr meldet, der Wechselrichter aber bereits ins Netz drueckt.
      # Das Totband wird spaeter nur einmal beim Vollspeicher-Ueberschuss abgezogen.
      exchange_grid_surplus_w: >-
        {{ ([0, uncontrolled_surplus_w | float(0)] | max) | round(0) }}

      # Quellbezogener Ueberschuss von Speicher 1 vor Anwendung der Transfer-Schwelle.
      # Berechnung: max(0, aktuelle Batterieladeleistung Speicher 1 - reservierte Haus-Einspeisung).
      # Diese Rechnung stellt sicher, dass Speicher 1 die bisherige bzw. benoetigte Hausversorgung voll uebernehmen kann, bevor er zusaetzlich Speicher 2 laedt.
      storage1_source_surplus_before_exchange_threshold_w: >-
        {{ ([0, (storage1_batt_charge_w | float(0)) - (balance_required_house_output_w | float(0))] | max) | round(0) }}

      # Quellbezogener Ueberschuss von Speicher 2 vor Anwendung der Transfer-Schwelle.
      # Gleiche Berechnung wie fuer Speicher 1: Batterieladeleistung minus fuer Hausversorgung reservierter Output.
      storage2_source_surplus_before_exchange_threshold_w: >-
        {{ ([0, (storage2_batt_charge_w | float(0)) - (balance_required_house_output_w | float(0))] | max) | round(0) }}

      # Nicht voller Speicher 1 darf nur den Anteil oberhalb surplus_exchange_threshold_w weitergeben.
      # Berechnung: max(0, quellbezogener Ueberschuss Speicher 1 - konfigurierter Grenzwert).
      # Beispiel: 800 W quellbezogener Ueberschuss und 200 W Grenzwert ergeben 600 W moeglichen Transfer.
      storage1_source_surplus_above_exchange_threshold_w: >-
        {{ ([0, (storage1_source_surplus_before_exchange_threshold_w | float(0)) - (surplus_exchange_threshold_w_value | float(1000))] | max) | round(0) }}

      # Nicht voller Speicher 2 darf nur den Anteil oberhalb surplus_exchange_threshold_w weitergeben.
      # Gleiche Berechnung wie fuer Speicher 1.
      storage2_source_surplus_above_exchange_threshold_w: >-
        {{ ([0, (storage2_source_surplus_before_exchange_threshold_w | float(0)) - (surplus_exchange_threshold_w_value | float(1000))] | max) | round(0) }}

      # Zusatzpruefung fuer Regel 1: Speicher 1 muss nach Abzug der reservierten Haus-Einspeisung mehr Ueberschuss haben als Speicher 2 aktuell selbst einspeist.
      # Damit wird die Anforderung abgebildet, dass der Ueberschuss des abgebenden Speichers groesser sein muss als die aktuelle Einspeisung des annehmenden Speichers.
      storage1_source_surplus_covers_other_current_output: >-
        {{ (storage1_source_surplus_before_exchange_threshold_w | float(0)) > (storage2_current_output_w | float(0)) }}

      # Zusatzpruefung fuer Regel 1 in Richtung Speicher 2 -> Speicher 1.
      # Speicher 2 muss nach Abzug der reservierten Haus-Einspeisung mehr Ueberschuss haben als Speicher 1 aktuell selbst einspeist.
      storage2_source_surplus_covers_other_current_output: >-
        {{ (storage2_source_surplus_before_exchange_threshold_w | float(0)) > (storage1_current_output_w | float(0)) }}

      # Fuer volle Speicher wird als verfuegbarer Vollspeicher-Ueberschuss der groessere Wert aus quellbezogenem Batterielade-Ueberschuss und realem Netzüberschuss verwendet.
      # Danach wird nur das Totband abgezogen, nicht die konfigurierbare Transfer-Schwelle, weil ein voller Speicher keine weitere Reserve aufnehmen kann.
      storage1_full_surplus_available_for_exchange_w: >-
        {% set source_surplus = storage1_source_surplus_before_exchange_threshold_w | float(0) %}
        {% set grid_surplus = exchange_grid_surplus_w | float(0) %}
        {% set raw = [source_surplus, grid_surplus] | max %}
        {{ ([0, raw - (zero_tolerance_w_value | float(40))] | max) | round(0) }}

      # Verfuegbarer Vollspeicher-Ueberschuss fuer Speicher 2.
      # Gleiche Logik wie bei Speicher 1.
      storage2_full_surplus_available_for_exchange_w: >-
        {% set source_surplus = storage2_source_surplus_before_exchange_threshold_w | float(0) %}
        {% set grid_surplus = exchange_grid_surplus_w | float(0) %}
        {% set raw = [source_surplus, grid_surplus] | max %}
        {{ ([0, raw - (zero_tolerance_w_value | float(40))] | max) | round(0) }}

      # Headroom des Speichers 1 fuer Transfer, nachdem die Hausversorgung reserviert wurde.
      # Berechnung: max(0, maximale Entlade-/Transferleistung Speicher 1 aus *_inverse_max_power - reservierte Haus-Einspeisung).
      # Der eigentliche Transfer darf diese Restkapazitaet nicht ueberschreiten, damit Hausverbrauch und Speicherladung zusammen vom abgebenden Speicher getragen werden koennen.
      storage1_exchange_output_headroom_w: >-
        {{ ([0, (storage1_max_discharge_w | float(0)) - (balance_required_house_output_w | float(0))] | max) | round(0) }}

      # Headroom des Speichers 2 fuer Transfer nach gleicher Berechnung.
      storage2_exchange_output_headroom_w: >-
        {{ ([0, (storage2_max_discharge_w | float(0)) - (balance_required_house_output_w | float(0))] | max) | round(0) }}

      # Voller Speicher 1 darf Speicher 2 laden, wenn Speicher 2 niedriger liegt, laden kann und Speicher 1 nach reservierter Hausversorgung noch Transferleistung frei hat.
      full_transfer_1_to_2: >-
        {{ (base_energy_state | trim) != 'emergency'
           and (storage1_full | bool(false))
           and (storage2_can_charge | bool(false))
           and (storage1_can_discharge | bool(false))
           and (storage1_soc_above_storage2 | bool(false))
           and (storage2_max_charge_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage1_exchange_output_headroom_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage1_full_surplus_available_for_exchange_w | float(0)) >= (balance_transfer_min_w_value | float(50)) }}

      # Voller Speicher 2 darf Speicher 1 laden, wenn Speicher 1 niedriger liegt, laden kann und Speicher 2 nach reservierter Hausversorgung noch Transferleistung frei hat.
      full_transfer_2_to_1: >-
        {{ (base_energy_state | trim) != 'emergency'
           and (storage2_full | bool(false))
           and (storage1_can_charge | bool(false))
           and (storage2_can_discharge | bool(false))
           and (storage2_soc_above_storage1 | bool(false))
           and (storage1_max_charge_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage2_exchange_output_headroom_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage2_full_surplus_available_for_exchange_w | float(0)) >= (balance_transfer_min_w_value | float(50)) }}

      # Nicht voller Speicher 1 darf Speicher 2 nach Regel 1 laden.
      # Bedingungen: keine Notladung, Speicher 2 hat niedrigeren SoC und kann laden, Speicher 1 darf entladen, der quellbezogene Ueberschuss liegt oberhalb der Schwelle,
      # der Ueberschuss ist groesser als die aktuelle Einspeisung des anderen Speichers und nach der Hausversorgungsreserve bleibt ausreichend Output-Headroom.
      surplus_transfer_1_to_2: >-
        {{ (base_energy_state | trim) != 'emergency'
           and not (storage1_full | bool(false))
           and (storage1_can_discharge | bool(false))
           and (storage2_can_charge | bool(false))
           and (storage1_soc_above_storage2 | bool(false))
           and (storage1_source_surplus_covers_other_current_output | bool(false))
           and (storage2_max_charge_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage1_exchange_output_headroom_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage1_source_surplus_above_exchange_threshold_w | float(0)) >= (balance_transfer_min_w_value | float(50)) }}

      # Nicht voller Speicher 2 darf Speicher 1 nach Regel 1 laden.
      # Gleiche Bedingungen wie oben mit umgekehrter Richtung.
      surplus_transfer_2_to_1: >-
        {{ (base_energy_state | trim) != 'emergency'
           and not (storage2_full | bool(false))
           and (storage2_can_discharge | bool(false))
           and (storage1_can_charge | bool(false))
           and (storage2_soc_above_storage1 | bool(false))
           and (storage2_source_surplus_covers_other_current_output | bool(false))
           and (storage1_max_charge_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage2_exchange_output_headroom_w | float(0)) >= (balance_transfer_min_w_value | float(50))
           and (storage2_source_surplus_above_exchange_threshold_w | float(0)) >= (balance_transfer_min_w_value | float(50)) }}

      # Richtung des Speicher-zu-Speicher-Transfers.
      # Prioritaet: voller Speicher vor nicht vollem Speicher mit quellbezogenem Ueberschuss oberhalb des Grenzwerts.
      balance_direction: >-
        {% if (full_transfer_1_to_2 | bool(false)) %}
          1_to_2
        {% elif (full_transfer_2_to_1 | bool(false)) %}
          2_to_1
        {% elif (surplus_transfer_1_to_2 | bool(false)) %}
          1_to_2
        {% elif (surplus_transfer_2_to_1 | bool(false)) %}
          2_to_1
        {% else %}
          none
        {% endif %}

      # Grund fuer den Transfer.
      # full bedeutet: abgebender Speicher ist voll und sein Ueberschuss wird ohne surplus_exchange_threshold_w weitergegeben.
      # source_threshold bedeutet: nicht voller Speicher gibt nur den Anteil oberhalb surplus_exchange_threshold_w weiter.
      balance_reason: >-
        {% if (full_transfer_1_to_2 | bool(false)) or (full_transfer_2_to_1 | bool(false)) %}
          full
        {% elif (surplus_transfer_1_to_2 | bool(false)) or (surplus_transfer_2_to_1 | bool(false)) %}
          source_threshold
        {% else %}
          none
        {% endif %}

      # Effektiver Modus nach Transferentscheidung.
      # emergency bleibt hoechste Prioritaet; danach kommt balance; sonst der Grundzustand.
      normal_mode: >-
        {% if (base_energy_state | trim) == 'emergency' %}
          emergency
        {% elif (balance_direction | trim) != 'none' %}
          balance
        {% else %}
          {{ base_energy_state | trim }}
        {% endif %}

  - variables:
      # Block: Notladung und gegenseitige Notladeunterstuetzung berechnen.
      # Detail: Dieser Block wird relevant, wenn mindestens ein Speicher unterhalb der konfigurierten Notladegrenze liegt oder eine laufende Notladung bis zur Stoppschwelle fortgesetzt wird.
      # Detail: Die Gesamt-Notladeleistung wird aus Anzahl niedriger Speicher, Notladeleistung je Speicher, Hausnetz-Ladelimit und technischen Ladegrenzen gebildet.
      # Detail: Die Verteilung nutzt Gewichte aus Kapazitaet und fehlendem SoC bis zur Stoppschwelle, damit ein groesserer oder niedrigerer Speicher entsprechend mehr Ladeleistung erhaelt.
      # Detail: Gegenseitige Notladeunterstuetzung wird nur berechnet, wenn der abgebende Speicher oberhalb der konfigurierten Reserve liegt und einen hoeheren SoC als der annehmende Speicher hat.
      # Detail: Reicht diese Reserve nicht, bleibt emergency_transfer_w 0 und die Notladung erfolgt aus dem Hausnetz.
      # Berechnet Gesamt-Notladeleistung, SoC-/Kapazitaetsgewichte und ob die Energie vom anderen Speicher oder aus dem Hausnetz kommen soll.
      # Notladeleistung gesamt, wenn ein oder beide Speicher unter dem Notlade-SoC liegen.
      # Berechnung: Anzahl niedriger Speicher * Notladeleistung, begrenzt durch Hausnetzlimit und Speicherlimits.
      emergency_total_w: >-
        {% set low_count = (1 if (storage1_needs_grid_charge | bool(false)) else 0) + (1 if (storage2_needs_grid_charge | bool(false)) else 0) %}
        {% set max_available = (storage1_max_charge_w | float(0) if (storage1_needs_grid_charge | bool(false)) else 0) + (storage2_max_charge_w | float(0) if (storage2_needs_grid_charge | bool(false)) else 0) %}
        {% if (normal_mode | trim) == 'emergency' and low_count > 0 %}
          {{ ([emergency_charge_w_value | float(300) * low_count, max_house_grid_power_w_value | float(1000), max_available] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Gewicht fuer Notladung Speicher 1.
      # Berechnung: Kapazitaet in Wh * fehlende Prozentpunkte bis zum Notlade-Stopp.
      emergency_weight_1: >-
        {% if storage1_needs_grid_charge | bool(false) %}
          {% set d = [(grid_charge_stop_soc_value | float(20)) - (storage1_soc | float(0)), 1] | max %}
          {{ (storage1_capacity_wh | float(1) * d) | round(2) }}
        {% else %}
          0
        {% endif %}

      # Gewicht fuer Notladung Speicher 2.
      # Berechnung: Kapazitaet in Wh * fehlende Prozentpunkte bis zum Notlade-Stopp.
      emergency_weight_2: >-
        {% if storage2_needs_grid_charge | bool(false) %}
          {% set d = [(grid_charge_stop_soc_value | float(20)) - (storage2_soc | float(0)), 1] | max %}
          {{ (storage2_capacity_wh | float(1) * d) | round(2) }}
        {% else %}
          0
        {% endif %}

      # Gegenseitige Notladeleistung, falls ein Speicher genug Reserve hat.
      # Sonst bleibt der Wert 0 und die Notladung erfolgt aus dem Netz.
      emergency_transfer_w: >-
        {% if emergency_transfer_1_to_2 | bool(false) %}
          {{ ([emergency_charge_w_value | float(300), storage1_max_discharge_w | float(0), storage2_max_charge_w | float(0)] | min) | round(0) }}
        {% elif emergency_transfer_2_to_1 | bool(false) %}
          {{ ([emergency_charge_w_value | float(300), storage2_max_discharge_w | float(0), storage1_max_charge_w | float(0)] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Summe der Notladegewichte zur proportionalen Verteilung.
      emergency_weight_total: "{{ (emergency_weight_1 | float(0)) + (emergency_weight_2 | float(0)) }}"

  - variables:
      # Block: normale Lade- und Entladeverteilung ohne aktiven Speicher-zu-Speicher-Transfer berechnen.
      # Detail: Dieser Block beschreibt den Normalbetrieb, wenn kein Balance-Transfer aktiv ist.
      # Detail: Bei Ueberschuss wird Ladeleistung auf Speicher verteilt, die noch laden duerfen; die Verteilung bevorzugt groessere Kapazitaet und niedrigeren SoC.
      # Detail: Bei Netzbezug wird Entladeleistung zuerst bis zur Einzel-Speicher-Grenze nach Kapazitaet, *_available_kwh und aktueller Batterieladeleistung gewichtet.
      # Detail: Sind beide Speicher voll, wird in diesem gewichteten Bereich bewusst 50/50 verteilt, sofern beide oberhalb der Entlade-Reserve liegen.
      # Detail: Wird mehr Leistung benoetigt als die gewichtete Einzel-Speicher-Stufe, wird der Mehrbedarf auf freie Entladekapazitaeten beider Speicher verteilt, sodass beide parallel bis zu ihren Grenzen liefern koennen.
      # Detail: Ein Speicher am unteren SoC-/available_kwh-Limit bekommt Gewicht und Ziel-Output 0; der andere Speicher uebernimmt dann allein bis zu seiner Grenze.
      # Verteilt Ueberschussladung und Entladung gegen Netzbezug proportional nach Kapazitaet, SoC, *_available_kwh und aktueller Batterieladeleistung.
      # Speicher an der unteren Entladegrenze erhalten Gewicht 0; der andere Speicher uebernimmt dann die volle benoetigte Einspeiseleistung bis zu seinem Limit.
      # Normale Ueberschussladung ohne Speicher-zu-Speicher-Transfer.
      # Berechnung: verfuegbarer Ueberschuss, begrenzt durch Hausnetzlimit und Ladefaehigkeit beider Speicher.
      no_balance_base_input_total_w: >-
        {% if (normal_mode | trim) == 'surplus' %}
          {% set max_available = (storage1_max_charge_w | float(0) if (storage1_can_charge | bool(false)) else 0) + (storage2_max_charge_w | float(0) if (storage2_can_charge | bool(false)) else 0) %}
          {{ ([uncontrolled_surplus_w | float(0), max_house_grid_power_w_value | float(1000), max_available] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Ladegewicht Speicher 1: groessere Kapazitaet und niedrigerer SoC bekommen mehr Ueberschuss.
      no_balance_input_weight_1: >-
        {% if (normal_mode | trim) == 'surplus' and (storage1_can_charge | bool(false)) %}
          {% set d = [(full_soc_value | float(98)) - (storage1_soc | float(0)), 0.1] | max %}
          {{ (storage1_capacity_wh | float(1) * d) | round(2) }}
        {% else %}
          0
        {% endif %}

      # Ladegewicht Speicher 2: gleiche Berechnung wie Speicher 1.
      no_balance_input_weight_2: >-
        {% if (normal_mode | trim) == 'surplus' and (storage2_can_charge | bool(false)) %}
          {% set d = [(full_soc_value | float(98)) - (storage2_soc | float(0)), 0.1] | max %}
          {{ (storage2_capacity_wh | float(1) * d) | round(2) }}
        {% else %}
          0
        {% endif %}

      # Normale Entladung gegen Netzbezug ohne Speicher-zu-Speicher-Transfer.
      # Berechnung: Netzbezug, begrenzt durch die Summe der aus *_inverse_max_power ermittelten Entladegrenzen der entladefaehigen Speicher.
      # Dadurch kann bei mehr als einer Einzel-Speicher-Grenze Bedarf beide Speicher parallel bis zu ihrer jeweiligen Grenze nutzen.
      # Speicher am unteren SoC-Limit oder ohne *_available_kwh werden durch storage*_can_discharge ausgeschlossen; ein einzelner verbleibender Speicher bekommt dadurch 100 Prozent des Bedarfs.
      no_balance_base_output_total_w: >-
        {% if (normal_mode | trim) == 'import' %}
          {% set max_available = (storage1_max_discharge_w | float(0) if (storage1_can_discharge | bool(false)) else 0) + (storage2_max_discharge_w | float(0) if (storage2_can_discharge | bool(false)) else 0) %}
          {{ ([uncontrolled_import_w | float(0), max_available] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Entlade-/Einspeisegewicht Speicher 1.
      # Entscheidung: Wenn Speicher 1 die untere Entladegrenze erreicht hat, ist storage1_can_discharge false und das Gewicht wird 0.
      # Sind beide Speicher voll und entladefaehig, wird Speicher 1 mit Gewicht 1 bewertet, damit spaeter eine 50/50-Verteilung entsteht.
      # Sonst: verfuegbare Energie aus *_available_kwh bestimmt die Basis; das Verhaeltnis *_available_kwh / *_total_kwh und die aktuelle Batterieladeleistung erhoehen das Gewicht.
      # Berechnung bei nicht vollen Speichern:
      #   nutzbare Basisenergie = max(available_kwh * 1000, capacity_wh * max(SoC - Reserve, 0) / 100)
      #   Verfuegbarkeitsfaktor = 0.5 + available_kwh / total_kwh
      #   Ladeleistungsfaktor = 1 + min(aktuelle Batterieladeleistung, Referenzlimit) / Referenzlimit
      #   Referenzlimit = max(maximale Ladeleistung ueber Hausnetz, Entladegrenze Speicher 1, Entladegrenze Speicher 2, 1)
      #   Gewicht = Basisenergie * Verfuegbarkeitsfaktor * Ladeleistungsfaktor
      no_balance_output_weight_1: >-
        {% if (normal_mode | trim) == 'import' and (storage1_can_discharge | bool(false)) %}
          {% if (both_storages_full | bool(false)) and (storage2_can_discharge | bool(false)) %}
            1
          {% else %}
            {% set fallback_wh = (storage1_capacity_wh | float(1)) * ([(storage1_soc | float(0)) - (reserve_soc_value | float(15)), 0] | max) / 100 %}
            {% set base_wh = [storage1_available_wh | float(0), fallback_wh, 1] | max %}
            {% set availability_factor = 0.5 + (storage1_available_ratio | float(0)) %}
            {% set ref = [max_house_grid_power_w_value | float(1000), storage1_max_discharge_w | float(0), storage2_max_discharge_w | float(0), 1] | max %}
            {% set charge_factor = 1 + ([storage1_batt_charge_w | float(0), ref] | min) / ref %}
            {{ (base_wh * availability_factor * charge_factor) | round(2) }}
          {% endif %}
        {% else %}
          0
        {% endif %}

      # Entlade-/Einspeisegewicht Speicher 2 mit gleicher Berechnung wie Speicher 1.
      # Wenn Speicher 2 die untere Entladegrenze erreicht hat, ist storage2_can_discharge false und das Gewicht wird 0.
      # Wenn beide Speicher voll sind, erhaelt Speicher 2 ebenfalls Gewicht 1; andernfalls entscheidet die verfuegbare Energie, das Kapazitaetsverhaeltnis und die aktuelle Batterieladeleistung.
      no_balance_output_weight_2: >-
        {% if (normal_mode | trim) == 'import' and (storage2_can_discharge | bool(false)) %}
          {% if (both_storages_full | bool(false)) and (storage1_can_discharge | bool(false)) %}
            1
          {% else %}
            {% set fallback_wh = (storage2_capacity_wh | float(1)) * ([(storage2_soc | float(0)) - (reserve_soc_value | float(15)), 0] | max) / 100 %}
            {% set base_wh = [storage2_available_wh | float(0), fallback_wh, 1] | max %}
            {% set availability_factor = 0.5 + (storage2_available_ratio | float(0)) %}
            {% set ref = [max_house_grid_power_w_value | float(1000), storage1_max_discharge_w | float(0), storage2_max_discharge_w | float(0), 1] | max %}
            {% set charge_factor = 1 + ([storage2_batt_charge_w | float(0), ref] | min) / ref %}
            {{ (base_wh * availability_factor * charge_factor) | round(2) }}
          {% endif %}
        {% else %}
          0
        {% endif %}

      # Summen der Verteilgewichte fuer die proportionale Berechnung.
      # Wenn ein Speicher wegen Reserve-SoC nicht entladen darf, ist sein Output-Gewicht 0; der andere Speicher erhaelt dadurch rechnerisch den gesamten Anteil.
      no_balance_input_weight_total: "{{ (no_balance_input_weight_1 | float(0)) + (no_balance_input_weight_2 | float(0)) }}"
      no_balance_output_weight_total: "{{ (no_balance_output_weight_1 | float(0)) + (no_balance_output_weight_2 | float(0)) }}"

      # Grenze fuer die bisherige gewichtete Entladeverteilung.
      # Berechnung: groesste aus *_inverse_max_power ermittelte Einzel-Entladegrenze der entladefaehigen Speicher.
      # Bei zwei Speichern richtet sich dieser Wert nach dem groessten aktuell aus *_inverse_max_power gelesenen Speicherwert. Bis zu dieser Gesamtleistung gilt die kapazitaets- und ladeleistungsbasierte Einteilung.
      no_balance_weighted_output_tier_limit_w: >-
        {% set s1 = storage1_max_discharge_w | float(0) if (storage1_can_discharge | bool(false)) else 0 %}
        {% set s2 = storage2_max_discharge_w | float(0) if (storage2_can_discharge | bool(false)) else 0 %}
        {{ ([s1, s2] | max) | round(0) }}

      # Anteil des Entladebedarfs, der nach der bisherigen Gewichtungslogik verteilt wird.
      # Berechnung: min(Gesamtbedarf, groesste Einzel-Entladegrenze).
      no_balance_weighted_output_total_w: >-
        {{ ([no_balance_base_output_total_w | float(0), no_balance_weighted_output_tier_limit_w | float(0)] | min) | round(0) }}

      # Zusatzbedarf oberhalb der Einzel-Speicher-Grenze.
      # Dieser Anteil wird anschliessend auf die noch freien Entladekapazitaeten beider Speicher verteilt, sodass beide parallel bis zu ihrer Grenze liefern koennen.
      no_balance_parallel_extra_output_w: >-
        {{ ([0, (no_balance_base_output_total_w | float(0)) - (no_balance_weighted_output_total_w | float(0))] | max) | round(0) }}

  - variables:
      # Block: technische Limits des Speicher-zu-Speicher-Transfers und Basis-Zielwerte berechnen.
      # Detail: Dieser Block berechnet nicht die Richtung des Transfers, sondern nur dessen technisch erlaubte Hoehe und vorbereitende Vergleichswerte.
      # Detail: Die maximale Abgabeleistung kommt aus der aus *_inverse_max_power ermittelten Entlade-/Transfergrenze des abgebenden Speichers und ggf. aus dem Zendure-output_limit-Maximum.
      # Detail: Die maximale Aufnahmeleistung kommt aus der input_limit-Grenze des annehmenden Speichers.
      # Detail: Bei vollem abgebendem Speicher wird der im Betriebsmodus berechnete Vollspeicher-Ueberschuss verwendet.
      # Detail: Bei nicht vollem abgebendem Speicher wird nur der quellbezogene Anteil oberhalb surplus_exchange_threshold_w verwendet.
      # Detail: Aus der maximalen Entladeleistung des abgebenden Speichers wird zuerst die fuer die Hausversorgung reservierte Leistung abgezogen; nur der Rest darf Transfer werden.
      # Detail: balance_transfer_w ist die finale Ladeleistung des annehmenden Speichers. Der Output des abgebenden Speichers ist spaeter Hausversorgung plus Transfer.
      # Ermittelt Quelle/Ziel, begrenzt den Transfer durch *_inverse_max_power nach reservierter Hausversorgung, Ladegrenze des annehmenden Speichers und verfuegbaren Quell-Ueberschuss.
      # Speicher-zu-Speicher-Quelle: maximal moegliche Entladeleistung des abgebenden Speichers.
      balance_source_max_discharge_w: >-
        {% if (balance_direction | trim) == '1_to_2' %}
          {{ storage1_max_discharge_w | float(0) }}
        {% elif (balance_direction | trim) == '2_to_1' %}
          {{ storage2_max_discharge_w | float(0) }}
        {% else %}
          0
        {% endif %}

      # Speicher-zu-Speicher-Ziel: maximal moegliche Ladeleistung des annehmenden Speichers.
      balance_target_max_charge_w: >-
        {% if (balance_direction | trim) == '1_to_2' %}
          {{ storage2_max_charge_w | float(0) }}
        {% elif (balance_direction | trim) == '2_to_1' %}
          {{ storage1_max_charge_w | float(0) }}
        {% else %}
          0
        {% endif %}

      # Fuer die Hausversorgung reservierte Output-Leistung des abgebenden Speichers.
      # Wenn kein Balance-Transfer aktiv ist, ist dieser Wert 0.
      # Bei aktivem Balance-Transfer wird die zuvor berechnete Haus-Einspeisung reserviert, damit der Quellspeicher nicht nur den anderen Speicher laedt, sondern gleichzeitig die bisherige Hausversorgung uebernimmt.
      balance_source_house_output_w: >-
        {% if (balance_direction | trim) != 'none' %}
          {{ ([balance_required_house_output_w | float(0), balance_source_max_discharge_w | float(0)] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Nach Hausversorgungsreserve verbleibende Entladeleistung des abgebenden Speichers fuer Transfer.
      # Berechnung: max(0, maximale Entlade-/Transferleistung des abgebenden Speichers - reservierte Haus-Einspeisung).
      balance_source_transfer_headroom_w: >-
        {{ ([0, (balance_source_max_discharge_w | float(0)) - (balance_source_house_output_w | float(0))] | max) | round(0) }}

      # Begrenzung des abgebenden Ueberschusses.
      # Bei vollem Speicher wird der Vollspeicher-Ueberschuss verwendet; bei nicht vollem Speicher der quellbezogene Ueberschuss oberhalb der Schwelle.
      balance_source_surplus_cap_w: >-
        {% if (balance_direction | trim) == '1_to_2' and (balance_reason | trim) == 'full' %}
          {{ storage1_full_surplus_available_for_exchange_w | float(0) | round(0) }}
        {% elif (balance_direction | trim) == '2_to_1' and (balance_reason | trim) == 'full' %}
          {{ storage2_full_surplus_available_for_exchange_w | float(0) | round(0) }}
        {% elif (balance_direction | trim) == '1_to_2' and (balance_reason | trim) == 'source_threshold' %}
          {{ storage1_source_surplus_above_exchange_threshold_w | float(0) | round(0) }}
        {% elif (balance_direction | trim) == '2_to_1' and (balance_reason | trim) == 'source_threshold' %}
          {{ storage2_source_surplus_above_exchange_threshold_w | float(0) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Gewuenschter Transfer vor technischen Limits.
      # full: der volle Speicher gibt seinen verfuegbaren Ueberschuss weiter.
      # source_threshold: der nicht volle Speicher gibt nur den Anteil oberhalb surplus_exchange_threshold_w weiter.
      balance_raw_desired_w: >-
        {{ balance_source_surplus_cap_w | float(0) | round(0) }}

      # Endgueltiger Speicher-zu-Speicher-Transfer als Ladeleistung des annehmenden Speichers.
      # Berechnung: min(Wunsch, nach Hausversorgung freie Entladeleistung des abgebenden Speichers, Ladegrenze des annehmenden Speichers, verfuegbarer Quell-Ueberschuss).
      # Es gibt kein separates Transferlimit mehr; die aus *_inverse_max_power gelesene maximale Entladeleistung des abgebenden Speichers ist die Gesamtgrenze fuer Hausversorgung plus Transfer.
      balance_transfer_w: >-
        {% if (balance_direction | trim) != 'none' and (balance_raw_desired_w | float(0)) >= (balance_transfer_min_w_value | float(50)) %}
          {{ ([balance_raw_desired_w | float(0), balance_source_transfer_headroom_w | float(0), balance_target_max_charge_w | float(0), balance_source_surplus_cap_w | float(0)] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Gesamt-Output des abgebenden Speichers im Balance-Modus.
      # Berechnung: fuer Hausversorgung reservierter Output + Speicher-zu-Speicher-Transfer, begrenzt durch die maximale Entladeleistung des abgebenden Speichers.
      # Im Beispiel werden dadurch 200 W Hausversorgung plus 600 W Transfer zu 800 W Output des abgebenden Speichers.
      balance_source_total_output_w: >-
        {% if (balance_direction | trim) != 'none' and (balance_transfer_w | float(0)) >= (balance_transfer_min_w_value | float(50)) %}
          {{ ([balance_source_max_discharge_w | float(0), (balance_source_house_output_w | float(0)) + (balance_transfer_w | float(0))] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Verteilte Ueberschussladung ohne Speicher-zu-Speicher-Transfer fuer Speicher 1.
      no_balance_storage1_input_w: >-
        {% if (no_balance_base_input_total_w | float(0)) > 0 and (storage1_can_charge | bool(false)) %}
          {% set split = (no_balance_base_input_total_w | float(0)) * (no_balance_input_weight_1 | float(0)) / ([no_balance_input_weight_total | float(0), 1] | max) %}
          {{ ([storage1_max_charge_w | float(0), split] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Verteilte Ueberschussladung ohne Speicher-zu-Speicher-Transfer fuer Speicher 2.
      no_balance_storage2_input_w: >-
        {% if (no_balance_base_input_total_w | float(0)) > 0 and (storage2_can_charge | bool(false)) %}
          {% set split = (no_balance_base_input_total_w | float(0)) * (no_balance_input_weight_2 | float(0)) / ([no_balance_input_weight_total | float(0), 1] | max) %}
          {{ ([storage2_max_charge_w | float(0), split] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Gewichteter Entladeanteil Speicher 1 innerhalb der Einzel-Speicher-Grenze.
      # Bei beiden vollen Speichern fuehrt die Gewichtung 1:1 zu gleichen Anteilen; sonst wird anhand *_available_kwh, Gesamtkapazitaet und Ladeleistung verteilt.
      no_balance_storage1_weighted_output_w: >-
        {% if (no_balance_weighted_output_total_w | float(0)) > 0 and (storage1_can_discharge | bool(false)) %}
          {% set split = (no_balance_weighted_output_total_w | float(0)) * (no_balance_output_weight_1 | float(0)) / ([no_balance_output_weight_total | float(0), 1] | max) %}
          {{ ([storage1_max_discharge_w | float(0), split] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Gewichteter Entladeanteil Speicher 2 innerhalb der Einzel-Speicher-Grenze.
      # Gleiche Berechnung wie bei Speicher 1; ein Speicher am unteren SoC-Limit hat Gewicht 0.
      no_balance_storage2_weighted_output_w: >-
        {% if (no_balance_weighted_output_total_w | float(0)) > 0 and (storage2_can_discharge | bool(false)) %}
          {% set split = (no_balance_weighted_output_total_w | float(0)) * (no_balance_output_weight_2 | float(0)) / ([no_balance_output_weight_total | float(0), 1] | max) %}
          {{ ([storage2_max_discharge_w | float(0), split] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Nach der gewichteten Verteilung noch freie Entladekapazitaet von Speicher 1.
      # Berechnung: max(0, aus *_inverse_max_power gelesene maximale Entladeleistung Speicher 1 - gewichteter Anteil Speicher 1).
      no_balance_storage1_remaining_output_capacity_w: >-
        {% if storage1_can_discharge | bool(false) %}
          {{ ([0, (storage1_max_discharge_w | float(0)) - (no_balance_storage1_weighted_output_w | float(0))] | max) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Nach der gewichteten Verteilung noch freie Entladekapazitaet von Speicher 2.
      # Berechnung: max(0, aus *_inverse_max_power gelesene maximale Entladeleistung Speicher 2 - gewichteter Anteil Speicher 2).
      no_balance_storage2_remaining_output_capacity_w: >-
        {% if storage2_can_discharge | bool(false) %}
          {{ ([0, (storage2_max_discharge_w | float(0)) - (no_balance_storage2_weighted_output_w | float(0))] | max) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Summe der freien Entladekapazitaeten fuer den Zusatzbedarf oberhalb der Einzel-Speicher-Grenze.
      no_balance_remaining_output_capacity_total_w: >-
        {{ (no_balance_storage1_remaining_output_capacity_w | float(0) + no_balance_storage2_remaining_output_capacity_w | float(0)) | round(0) }}

      # Zusatzanteil Speicher 1 oberhalb der Einzel-Speicher-Grenze.
      # Berechnung: Zusatzbedarf * freie Kapazitaet Speicher 1 / freie Gesamtkapazitaet, begrenzt auf die freie Kapazitaet von Speicher 1.
      no_balance_storage1_parallel_extra_output_w: >-
        {% if (no_balance_parallel_extra_output_w | float(0)) > 0 and (no_balance_remaining_output_capacity_total_w | float(0)) > 0 and (storage1_can_discharge | bool(false)) %}
          {% set split = (no_balance_parallel_extra_output_w | float(0)) * (no_balance_storage1_remaining_output_capacity_w | float(0)) / ([no_balance_remaining_output_capacity_total_w | float(0), 1] | max) %}
          {{ ([no_balance_storage1_remaining_output_capacity_w | float(0), split] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Zusatzanteil Speicher 2 oberhalb der Einzel-Speicher-Grenze.
      # Gleiche Berechnung wie bei Speicher 1.
      no_balance_storage2_parallel_extra_output_w: >-
        {% if (no_balance_parallel_extra_output_w | float(0)) > 0 and (no_balance_remaining_output_capacity_total_w | float(0)) > 0 and (storage2_can_discharge | bool(false)) %}
          {% set split = (no_balance_parallel_extra_output_w | float(0)) * (no_balance_storage2_remaining_output_capacity_w | float(0)) / ([no_balance_remaining_output_capacity_total_w | float(0), 1] | max) %}
          {{ ([no_balance_storage2_remaining_output_capacity_w | float(0), split] | min) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Finale Entladung/Einspeisung ins Hausnetz fuer Speicher 1.
      # Berechnung: gewichteter Anteil bis zur Einzel-Speicher-Grenze + Zusatzanteil oberhalb dieser Grenze, begrenzt durch Speicher-1-Entladegrenze.
      # Ist Speicher 2 an der unteren Entladegrenze und Speicher 1 darf entladen, uebernimmt Speicher 1 bis zu seinem aus *_inverse_max_power gelesenen Limit.
      no_balance_storage1_output_w: >-
        {{ ([storage1_max_discharge_w | float(0), (no_balance_storage1_weighted_output_w | float(0)) + (no_balance_storage1_parallel_extra_output_w | float(0))] | min) | round(0) }}

      # Finale Entladung/Einspeisung ins Hausnetz fuer Speicher 2.
      # Gleiche Berechnung wie bei Speicher 1.
      # Ist Speicher 1 an der unteren Entladegrenze und Speicher 2 darf entladen, uebernimmt Speicher 2 bis zu seinem aus *_inverse_max_power gelesenen Limit.
      no_balance_storage2_output_w: >-
        {{ ([storage2_max_discharge_w | float(0), (no_balance_storage2_weighted_output_w | float(0)) + (no_balance_storage2_parallel_extra_output_w | float(0))] | min) | round(0) }}

  - variables:
      # Block: endgueltige Ziel-Leistungen fuer beide Speicher berechnen.
      # Detail: In diesem Block werden aus allen Vorentscheidungen konkrete Watt-Zielwerte fuer input_limit und output_limit beider Speicher gebildet.
      # Detail: Die Prioritaet ist fest: zuerst Notladung, dann aktiver Speicher-zu-Speicher-Ausgleich, dann normale Ueberschussladung oder normale Entladung gegen Netzbezug.
      # Detail: Bei Balance erhaelt der annehmende Speicher die Transfer-Ladeleistung; der abgebende Speicher erhaelt als Output die Summe aus reservierter Hausversorgung und Transfer.
      # Detail: Bei Import nutzt der Block die zuvor berechnete kapazitaets- und ladeleistungsbasierte Entladeverteilung inklusive Zusatzbedarf oberhalb der Einzel-Speicher-Grenze.
      # Detail: Die harte can_discharge-Pruefung am Anfang der Output-Berechnung verhindert, dass ein Speicher am unteren SoC-Limit trotzdem aus einem anderen Zweig heraus entladen wird.
      # Entscheidet je Speicher zwischen Notladung, Balance-Transfer, Ueberschussladung, Entladung gegen Netzbezug oder 0 W.
      # Ziel-Ladeleistung Speicher 1.
      # Reihenfolge: Notladung von Speicher 2, Netz-Notladung, Balance von Speicher 2, normale Ueberschussladung.
      storage1_target_input_w: >-
        {% if (normal_mode | trim) == 'emergency' and (emergency_transfer_2_to_1 | bool(false)) %}
          {{ emergency_transfer_w | float(0) | round(0) }}
        {% elif (normal_mode | trim) == 'emergency' and (storage1_needs_grid_charge | bool(false)) and not (emergency_transfer_2_to_1 | bool(false)) %}
          {% set split = (emergency_total_w | float(0)) * (emergency_weight_1 | float(0)) / ([emergency_weight_total | float(0), 1] | max) %}
          {{ ([storage1_max_charge_w | float(0), split] | min) | round(0) }}
        {% elif (normal_mode | trim) == 'balance' and (balance_direction | trim) == '2_to_1' %}
          {{ ([storage1_max_charge_w | float(0), balance_transfer_w | float(0)] | min) | round(0) }}
        {% elif (normal_mode | trim) == 'surplus' %}
          {{ no_balance_storage1_input_w | float(0) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Ziel-Ladeleistung Speicher 2.
      # Gleiche Entscheidungslogik wie Speicher 1, mit umgekehrter Balance-Richtung.
      storage2_target_input_w: >-
        {% if (normal_mode | trim) == 'emergency' and (emergency_transfer_1_to_2 | bool(false)) %}
          {{ emergency_transfer_w | float(0) | round(0) }}
        {% elif (normal_mode | trim) == 'emergency' and (storage2_needs_grid_charge | bool(false)) and not (emergency_transfer_1_to_2 | bool(false)) %}
          {% set split = (emergency_total_w | float(0)) * (emergency_weight_2 | float(0)) / ([emergency_weight_total | float(0), 1] | max) %}
          {{ ([storage2_max_charge_w | float(0), split] | min) | round(0) }}
        {% elif (normal_mode | trim) == 'balance' and (balance_direction | trim) == '1_to_2' %}
          {{ ([storage2_max_charge_w | float(0), balance_transfer_w | float(0)] | min) | round(0) }}
        {% elif (normal_mode | trim) == 'surplus' %}
          {{ no_balance_storage2_input_w | float(0) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Ziel-Entladeleistung Speicher 1.
      # Speicher 1 entlaedt fuer Nottransfer, fuer Balance 1 -> 2 mit Hausversorgungsreserve plus Transfer oder anteilig gegen normalen Netzbezug.
      storage1_target_output_w: >-
        {% if not (storage1_can_discharge | bool(false)) %}
          0
        {% elif (normal_mode | trim) == 'emergency' and (emergency_transfer_1_to_2 | bool(false)) %}
          {{ emergency_transfer_w | float(0) | round(0) }}
        {% elif (normal_mode | trim) == 'balance' and (balance_direction | trim) == '1_to_2' %}
          {{ ([storage1_max_discharge_w | float(0), balance_source_total_output_w | float(0)] | min) | round(0) }}
        {% elif (normal_mode | trim) == 'import' %}
          {{ no_balance_storage1_output_w | float(0) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Ziel-Entladeleistung Speicher 2.
      # Speicher 2 entlaedt fuer Nottransfer, fuer Balance 2 -> 1 mit Hausversorgungsreserve plus Transfer oder anteilig gegen normalen Netzbezug.
      storage2_target_output_w: >-
        {% if not (storage2_can_discharge | bool(false)) %}
          0
        {% elif (normal_mode | trim) == 'emergency' and (emergency_transfer_2_to_1 | bool(false)) %}
          {{ emergency_transfer_w | float(0) | round(0) }}
        {% elif (normal_mode | trim) == 'balance' and (balance_direction | trim) == '2_to_1' %}
          {{ ([storage2_max_discharge_w | float(0), balance_source_total_output_w | float(0)] | min) | round(0) }}
        {% elif (normal_mode | trim) == 'import' %}
          {{ no_balance_storage2_output_w | float(0) | round(0) }}
        {% else %}
          0
        {% endif %}

  - variables:
      # Block: Zielmodi, geplante Netzreaktion und Solarman-Wechselrichterbegrenzung berechnen.
      # Detail: Dieser Block uebersetzt die Watt-Zielwerte in Zendure-AC-Modi und berechnet die erwartete Netzreaktion nach den geplanten Befehlen.
      # Detail: planned_input_total_w und planned_output_total_w zeigen, wie viel Lade- bzw. Entladeleistung die beiden Speicher zusammen in diesem Zyklus erhalten sollen.
      # Detail: planned_surplus_absorption_w verhindert vorschnelles Drosseln des Wechselrichters, wenn Ueberschuss bewusst zur Speicherladung oder zum Speicher-zu-Speicher-Transfer genutzt wird.
      # Detail: Im Balance-Modus ist planned_output_total_w groesser als planned_input_total_w, weil der abgebende Speicher zusaetzlich die Hausversorgung uebernimmt.
      # Detail: Nur Ueberschuss, der nach geplanter Speicheraufnahme uebrig bleibt, fliesst in surplus_for_inverter_throttle_w ein.
      # Detail: Der Wechselrichter wird schrittweise gedrosselt, wenn beide Speicher voll sind oder nicht mehr laden koennen; er wird wieder entdrosselt, wenn ein Speicher unter die Entdrossel-Schwelle faellt oder Netzbezug erkannt wird.
      # Detail: Am Ende wird die Watt-Zielgroesse in den Prozentwert fuer Solarman *_active_power_regulation umgerechnet.
      # Berechnet AC-Modi, geplante Lade-/Entladesummen, erwartete Netzleistung, verbleibenden Drossel-Ueberschuss und Prozentwert fuer *_active_power_regulation.
      # Zielmodus Speicher 1: fester Zendure-HA-Modus input, wenn geladen werden soll, sonst fester Modus output.
      storage1_target_mode: >-
        {% if (storage1_target_input_w | float(0)) > 0 %}
          {{ storage_input_option_value }}
        {% else %}
          {{ storage_output_option_value }}
        {% endif %}

      # Zielmodus Speicher 2: fester Zendure-HA-Modus input, wenn geladen werden soll, sonst fester Modus output.
      storage2_target_mode: >-
        {% if (storage2_target_input_w | float(0)) > 0 %}
          {{ storage_input_option_value }}
        {% else %}
          {{ storage_output_option_value }}
        {% endif %}

      # Geplante gesamte Speicherladung aus diesem Regelzyklus.
      planned_input_total_w: "{{ (storage1_target_input_w | float(0) + storage2_target_input_w | float(0)) | round(0) }}"

      # Geplante gesamte Speicherentladung aus diesem Regelzyklus.
      planned_output_total_w: "{{ (storage1_target_output_w | float(0) + storage2_target_output_w | float(0)) | round(0) }}"

      # Erwartete Netzleistung nach Speicherbefehlen.
      # Berechnung: Referenz-Netzleistung + geplante Ladung - geplante Entladung.
      predicted_grid_power_after_targets_w: >-
        {{ ((uncontrolled_grid_power_w | float(0)) + (planned_input_total_w | float(0)) - (planned_output_total_w | float(0))) | round(0) }}

      # Ueberschuss, der bewusst fuer Speicherladung oder Speicher-zu-Speicher-Transfer reserviert wird.
      # Diese Groesse verhindert, dass der Wechselrichter sofort drosselt, waehrend ein Speicher den Ueberschuss des anderen aufnimmt.
      planned_surplus_absorption_w: >-
        {% if (normal_mode | trim) in ['surplus', 'balance', 'emergency'] %}
          {{ planned_input_total_w | float(0) | round(0) }}
        {% else %}
          0
        {% endif %}

      # Ueberschuss, der fuer die Wechselrichterdrosselung uebrig bleibt.
      # Berechnung: max(0, berechneter Ueberschuss - bewusst geplante Speicheraufnahme).
      surplus_for_inverter_throttle_w: >-
        {{ ([0, (uncontrolled_surplus_w | float(0)) - (planned_surplus_absorption_w | float(0))] | max) | round(0) }}

      # Ziel-Leistung des Wechselrichters in Watt.
      # Drosseln nur, wenn nach geplanter Speicheraufnahme noch Ueberschuss bleibt und beide Speicher voll sind oder nicht mehr laden koennen.
      # Entdrosseln, wenn ein Speicher unterhalb des Entdrossel-SoC liegt oder Bezug erkannt wird.
      inverter_target_w: >-
        {% set current = inverter_current_w | float(inverter_max_w_value) %}
        {% set no_storage_room = (not (storage1_can_charge | bool(false))) and (not (storage2_can_charge | bool(false))) %}
        {% if inverter_unavailable | bool(false) %}
          {{ current | round(0) }}
        {% elif ((storage1_full | bool(false)) and (storage2_full | bool(false)) or no_storage_room) and (surplus_for_inverter_throttle_w | float(0)) > (zero_tolerance_w_value | float(40)) %}
          {% set step = [inverter_ramp_w_value | float(100), surplus_for_inverter_throttle_w | float(0)] | min %}
          {{ ([inverter_min_w_value | float(0), current - step] | max) | round(0) }}
        {% elif (storage1_soc | float(0)) < (inverter_unthrottle_soc_value | float(96))
              or (storage2_soc | float(0)) < (inverter_unthrottle_soc_value | float(96))
              or (uncontrolled_import_w | float(0)) > (zero_tolerance_w_value | float(40)) %}
          {{ ([inverter_max_w_value | float(2000), current + (inverter_ramp_w_value | float(100))] | min) | round(0) }}
        {% else %}
          {{ current | round(0) }}
        {% endif %}

      # Solarman erwartet Prozent fuer *_active_power_regulation.
      # Berechnung: Ziel-Watt / konfigurierte maximale Wechselrichterleistung * 100, begrenzt auf 0 bis 100.
      inverter_target_percent: >-
        {{ ([100, [0, (inverter_target_w | float(0)) / ([inverter_max_w_value | float(1), 1] | max) * 100] | max] | min) | round(0) }}

  # choose: Setzt die Solarman-Wechselrichterbegrenzung nur dann neu, wenn der Ziel-Prozentwert relevant abweicht.
  # Detail: Dieser Service-Block schreibt den berechneten Prozentwert in die Solarman-Number des Wechselrichters.
  # Detail: Ein Schreibvorgang erfolgt nur bei erreichbarem Wechselrichter und nur bei mindestens 1 Prozentpunkt Unterschied.
  # Detail: Dadurch werden staendige identische Schreibbefehle vermieden und die Regelung bleibt dennoch reaktionsschnell.
  - choose:
      # conditions: Wechselrichter ist erreichbar und aktuelle *_active_power_regulation weicht mindestens 1 Prozentpunkt vom Ziel ab.
      # Detail: Die Bedingung verbindet Sicherheitsstatus und Aenderungsschwelle.
      # Detail: Ist Solarman nicht erreichbar, wird kein number.set_value gesendet; der Off-Grid-Schutz wurde bereits vorher behandelt.
      # Detail: Ist die Abweichung kleiner als 1 Prozentpunkt, bleibt der aktuelle Wert stehen, weil die praktische Wirkung geringer als die Regelauflosung waere.
      - conditions:
          - condition: template
            value_template: >-
              {{ not (inverter_unavailable | bool(false)) and
                 ((states(inverter_active_power_regulation_entity) | float(0) - (inverter_target_percent | float(0))) | abs) >= 1 }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ inverter_active_power_regulation_entity }}"
            data:
              value: "{{ inverter_target_percent | float(0) }}"

  # choose: Aktualisiert die AC-Eingangsgrenze von Speicher 1 nur bei relevanter Aenderung.
  # Detail: Dieser Block schreibt das berechnete input_limit fuer Speicher 1.
  # Detail: Das input_limit steuert, wie viel AC-Leistung Speicher 1 aus Hausnetz, Ueberschuss oder Transfer aufnehmen darf.
  # Detail: Der Block ist getrennt vom output_limit, damit Laden und Entladen unabhaengig nachvollziehbar geregelt werden.
  - choose:
      # conditions: Aktuelle Eingangsgrenze von Speicher 1 unterscheidet sich mindestens um die konfigurierte Mindest-Aenderung vom Zielwert.
      # Detail: Die Bedingung vergleicht den aktuellen Number-Zustand mit storage1_target_input_w.
      # Detail: Erst wenn die Differenz groesser/gleich min_change_w ist, wird ein neuer Wert an Zendure gesendet.
      # Detail: Kleine Schwankungen innerhalb des Totbands erzeugen dadurch keine unnoetigen Service-Aufrufe.
      - conditions:
          - condition: template
            value_template: >-
              {{ ((states(storage1_input_number_entity) | float(0) - (storage1_target_input_w | float(0))) | abs)
                 >= (min_change_w_value | float(20)) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ storage1_input_number_entity }}"
            data:
              value: "{{ storage1_target_input_w | float(0) }}"
  # choose: Aktualisiert die AC-Ausgangsgrenze von Speicher 1 nur bei relevanter Aenderung.
  # Detail: Dieser Block schreibt das berechnete output_limit fuer Speicher 1.
  # Detail: Das output_limit begrenzt die Entladung zur Hausversorgung sowie die Abgabe bei Speicher-zu-Speicher-Transfer.
  # Detail: Die Zielberechnung hat bereits SoC-Reserve, available_kwh, technische Grenzen und Transfer-Richtung beruecksichtigt.
  - choose:
      # conditions: Aktuelle Ausgangsgrenze von Speicher 1 unterscheidet sich mindestens um die konfigurierte Mindest-Aenderung vom Zielwert.
      # Detail: Die Bedingung vergleicht den aktuellen Zendure-output_limit-Wert mit storage1_target_output_w.
      # Detail: Nur relevante Unterschiede werden geschrieben, damit die Integration nicht jede Sekunde mit unveraenderten Werten belastet wird.
      # Detail: Wenn Speicher 1 die untere Entladegrenze erreicht hat, ist storage1_target_output_w bereits 0 und wird bei relevanter Abweichung gesetzt.
      - conditions:
          - condition: template
            value_template: >-
              {{ ((states(storage1_output_number_entity) | float(0) - (storage1_target_output_w | float(0))) | abs)
                 >= (min_change_w_value | float(20)) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ storage1_output_number_entity }}"
            data:
              value: "{{ storage1_target_output_w | float(0) }}"
  # choose: Schaltet den AC-Modus von Speicher 1 auf Laden oder Entladen, sobald eine Zielleistung aktiv ist.
  # Detail: Dieser Block setzt den Zendure-ac_mode von Speicher 1 passend zu den Zielwerten.
  # Detail: Bei positiver Lade-Zielleistung wird fest 'input' verwendet; andernfalls fest 'output'.
  # Detail: Der Modus wird nur umgeschaltet, wenn Speicher 1 in diesem Zyklus tatsaechlich laden oder entladen soll.
  - choose:
      # conditions: Speicher 1 soll laden oder entladen und die aktuelle ac_mode-Option entspricht noch nicht dem Zielmodus.
      # Detail: Die Bedingung verhindert Moduswechsel bei 0-Watt-Zielwerten und bei bereits korrekt gesetztem Modus.
      # Detail: Dadurch bleibt ein ruhender Speicher unveraendert und Zendure erhaelt nur notwendige select.select_option-Aufrufe.
      # Detail: Der Zielmodus stammt aus storage1_target_mode und nutzt fest die Zendure-HA-Optionsnamen input/output.
      - conditions:
          - condition: template
            value_template: >-
              {{ ((storage1_target_input_w | float(0)) > 0 or (storage1_target_output_w | float(0)) > 0)
                 and states(storage1_ac_select_entity) != (storage1_target_mode | trim) }}
        sequence:
          - service: select.select_option
            target:
              entity_id: "{{ storage1_ac_select_entity }}"
            data:
              option: "{{ storage1_target_mode | trim }}"

  # choose: Aktualisiert die AC-Eingangsgrenze von Speicher 2 nur bei relevanter Aenderung.
  # Detail: Dieser Block schreibt das berechnete input_limit fuer Speicher 2.
  # Detail: Wie bei Speicher 1 bestimmt dieser Wert, wie viel AC-Leistung Speicher 2 aufnehmen darf.
  # Detail: Die Zielgroesse kann aus Notladung, normaler Ueberschussladung oder Speicher-zu-Speicher-Transfer stammen.
  - choose:
      # conditions: Aktuelle Eingangsgrenze von Speicher 2 unterscheidet sich mindestens um die konfigurierte Mindest-Aenderung vom Zielwert.
      # Detail: Die Bedingung vergleicht den aktuellen Number-Zustand mit storage2_target_input_w.
      # Detail: Nur Aenderungen groesser/gleich min_change_w werden an die Zendure-Integration geschrieben.
      # Detail: Das reduziert Schreiblast und verhindert ein Hin-und-her-Schreiben bei kleinen Messwertschwankungen.
      - conditions:
          - condition: template
            value_template: >-
              {{ ((states(storage2_input_number_entity) | float(0) - (storage2_target_input_w | float(0))) | abs)
                 >= (min_change_w_value | float(20)) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ storage2_input_number_entity }}"
            data:
              value: "{{ storage2_target_input_w | float(0) }}"
  # choose: Aktualisiert die AC-Ausgangsgrenze von Speicher 2 nur bei relevanter Aenderung.
  # Detail: Dieser Block schreibt das berechnete output_limit fuer Speicher 2.
  # Detail: Das output_limit wird fuer normale Hausversorgung und fuer Transferabgabe genutzt, falls Speicher 2 der abgebende Speicher ist.
  # Detail: Die Berechnung beruecksichtigt die individuelle maximale Entlade-/Transferleistung von Speicher 2.
  - choose:
      # conditions: Aktuelle Ausgangsgrenze von Speicher 2 unterscheidet sich mindestens um die konfigurierte Mindest-Aenderung vom Zielwert.
      # Detail: Die Bedingung vergleicht den aktuellen Zendure-output_limit-Wert mit storage2_target_output_w.
      # Detail: Ein Schreibvorgang erfolgt nur bei einer ausreichend grossen Differenz.
      # Detail: Erreicht Speicher 2 das untere SoC-/available_kwh-Limit, wird der Zielwert auf 0 gesetzt und bei Abweichung geschrieben.
      - conditions:
          - condition: template
            value_template: >-
              {{ ((states(storage2_output_number_entity) | float(0) - (storage2_target_output_w | float(0))) | abs)
                 >= (min_change_w_value | float(20)) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ storage2_output_number_entity }}"
            data:
              value: "{{ storage2_target_output_w | float(0) }}"
  # choose: Schaltet den AC-Modus von Speicher 2 auf Laden oder Entladen, sobald eine Zielleistung aktiv ist.
  # Detail: Dieser Block setzt den Zendure-ac_mode von Speicher 2 passend zu den berechneten Zielwerten.
  # Detail: Positive Ladeleistung fuehrt zum Lade-Modus; sonst wird bei aktiver Entladung der Entlade-Modus verwendet.
  # Detail: Der Block ist spiegelbildlich zu Speicher 1 aufgebaut, damit beide Speicher gleich nachvollziehbar gesteuert werden.
  - choose:
      # conditions: Speicher 2 soll laden oder entladen und die aktuelle ac_mode-Option entspricht noch nicht dem Zielmodus.
      # Detail: Die Bedingung sendet nur dann select.select_option, wenn Speicher 2 in diesem Zyklus eine aktive Lade- oder Entladeleistung erhalten soll.
      # Detail: Ist der Modus bereits korrekt, wird nichts geschrieben.
      # Detail: Dadurch werden unnoetige Moduswechsel und daraus entstehende Instabilitaeten vermieden.
      - conditions:
          - condition: template
            value_template: >-
              {{ ((storage2_target_input_w | float(0)) > 0 or (storage2_target_output_w | float(0)) > 0)
                 and states(storage2_ac_select_entity) != (storage2_target_mode | trim) }}
        sequence:
          - service: select.select_option
            target:
              entity_id: "{{ storage2_ac_select_entity }}"
            data:
              option: "{{ storage2_target_mode | trim }}"
